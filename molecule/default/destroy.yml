---
- name: Destroy the throwaway node
  hosts: localhost
  gather_facts: false
  vars:
    workdir: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}"

  tasks:
    # Killing by the recorded pid and then waiting for it to go: a stale pidfile
    # from a crashed run names a process that no longer exists, or worse, one
    # that is now something else entirely
    - name: Stop the VM if the recorded process is still ours
      ansible.builtin.shell:
        cmd: |
          pid=$(cat {{ workdir }}/qemu.pid 2>/dev/null) || exit 0
          kill -0 "$pid" 2>/dev/null || exit 0
          grep -qa qemu-system "/proc/$pid/cmdline" 2>/dev/null || exit 0
          kill "$pid"
          for _ in $(seq 30); do
              kill -0 "$pid" 2>/dev/null || exit 0
              sleep 1
          done
          kill -9 "$pid" 2>/dev/null || true
      changed_when: true

    # The disk is an overlay on the cached image, so this frees the run's
    # writes and leaves the download for the next one
    - name: Remove the disk and the seed
      ansible.builtin.file:
        path: "{{ workdir }}/{{ item }}"
        state: absent
      loop:
        - disk.qcow2
        - seed.iso
        - qemu.pid
        - qemu.log
        - console.log
