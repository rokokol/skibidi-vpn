---
# What the roles claim, asserted against the running machine rather than against
# the modules' own return values. Every assertion here is one that has a
# plausible way of being false on a real node.
- name: Verify the node came out the way the roles describe
  hosts: all
  gather_facts: true

  # The verifier runs no roles, so their defaults are not in scope, and reading
  # the same file the role reads is what keeps an assertion from becoming a copy
  # that drifts. Only common is loaded this way: vars_files outrank inventory
  # host_vars, so loading the others would silently replace the values this
  # scenario sets for the VM with the role's own defaults, and the checks would
  # compare the machine against something nobody deployed.
  vars_files:
    - ../../roles/common/defaults/main.yml

  # The metrics defaults under one name of their own, so they read the role's
  # file without outranking anything the scenario sets
  vars:
    verify_metrics: "{{ lookup('ansible.builtin.file', '../../roles/metrics/defaults/main.yml') | from_yaml }}"
    verify_api: http://{{ metrics_host }}:{{ verify_metrics.metrics_api_port }}
    verify_backup: "{{ lookup('ansible.builtin.file', '../../roles/backup/defaults/main.yml') | from_yaml }}"
    verify_staging: "{{ verify_backup.backup_state_dir }}/staging"
    verify_snapshots: "{{ station_dir }}/{{ inventory_hostname }}/snapshots"

  tasks:
    - name: Read the effective congestion control and queue discipline
      ansible.builtin.command: sysctl -n {{ item }}
      loop:
        - net.ipv4.tcp_congestion_control
        - net.core.default_qdisc
      register: verify_sysctl
      changed_when: false

    - name: The kernel actually uses what was configured
      ansible.builtin.assert:
        that:
          - verify_sysctl.results[0].stdout == common_congestion_control
          - verify_sysctl.results[1].stdout == common_qdisc
        fail_msg: >-
          sysctl reports {{ verify_sysctl.results[0].stdout }}/{{ verify_sysctl.results[1].stdout }};
          a setting written to a file the module never applied looks identical in the diff

    # The file a resolver library reads, not the role's variable: a symlink into
    # /run would still show the servers until the next boot
    - name: Read the resolver file and what it is
      ansible.builtin.stat:
        path: "{{ common_resolv_conf }}"
        follow: false
      register: verify_resolv_stat
      when: common_manage_resolver

    - name: Read the servers the resolver library will ask
      ansible.builtin.slurp:
        src: "{{ common_resolv_conf }}"
      register: verify_resolv
      when: common_manage_resolver

    - name: The resolver is a plain file that lists the declared servers in order
      when: common_manage_resolver
      ansible.builtin.assert:
        that:
          - not verify_resolv_stat.stat.islnk
          - >-
            (verify_resolv.content | b64decode).splitlines()
            | select('match', '^nameserver ')
            | map('regex_replace', '^nameserver ', '')
            | list == common_dns_servers
        fail_msg: "resolver is {{ verify_resolv.content | b64decode | trim }}, a link: {{ verify_resolv_stat.stat.islnk }}"

    - name: Ask whether the node resolves its own name
      ansible.builtin.command:
        argv: [getent, hosts, "{{ ansible_facts['hostname'] }}"]
      changed_when: false

    # The image's name on 127.0.1.1, the way a cloud image can leave it. The
    # name must then fail to resolve, or the repair below proves nothing
    - name: Put another name on 127.0.1.1
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s'
        line: "127.0.1.1 ubuntu"

    - name: Ask whether the node still resolves its own name
      ansible.builtin.command:
        argv: [getent, hosts, "{{ ansible_facts['hostname'] }}"]
      register: verify_unresolved
      changed_when: false
      failed_when: verify_unresolved.rc == 0

    - name: Repair the name the way a deploy does
      ansible.builtin.include_role:
        name: common
        tasks_from: hosts

    - name: Read the listening sockets
      ansible.builtin.command: ss -ltnH
      register: verify_sockets
      changed_when: false

    # The panel holds every client secret and the Reality private keys. A public
    # bind is the one failure that cannot be walked back after it is noticed.
    # Both clauses: a panel that is not listening at all would otherwise pass
    - name: The panel listens on the tunnel address and nowhere else
      ansible.builtin.assert:
        that:
          - verify_sockets.stdout_lines | select('search', ':' ~ xui_panel_port) | list | length > 0
          - >-
            verify_sockets.stdout_lines
            | select('search', ':' ~ xui_panel_port)
            | reject('search', xui_listen_ip)
            | list | length == 0
        fail_msg: "panel port {{ xui_panel_port }} answers somewhere other than {{ xui_listen_ip }}, or not at all"

    # Every file under the panel's directory carries the client secrets, the
    # backups included. Readable beyond root is the thing the role closes
    - name: Look for anything under the panel's directory readable beyond root
      ansible.builtin.shell:
        cmd: >-
          find {{ xui_db | dirname }} -maxdepth 1 \( -perm -o+r -o -perm -g+r \)
          \( -type d -o -name "{{ xui_db | basename }}*" \)
        executable: /bin/bash
      register: verify_db_perms
      changed_when: false

    - name: The database and its copies are readable by root alone
      ansible.builtin.assert:
        that: verify_db_perms.stdout | trim | length == 0
        fail_msg: "readable beyond root: {{ verify_db_perms.stdout_lines | join(', ') }}"

    # A jail can be loaded and green while reading the journal instead of the
    # file its filter was written for; the file it holds open is the proof
    - name: Ask fail2ban which file the panel's jail opened
      ansible.builtin.command:
        argv: [fail2ban-client, get, 3x-ipl, logpath]
      register: verify_ipl_logpath
      changed_when: false

    - name: The panel's jail reads the panel's log
      ansible.builtin.assert:
        that: "'/var/log/x-ui/3xipl.log' in verify_ipl_logpath.stdout"
        fail_msg: "the 3x-ipl jail opened {{ verify_ipl_logpath.stdout | trim or 'nothing' }}"

    # A real ban, end to end: an address from the documentation range, which
    # is never routed, is banned through fail2ban and looked for in the kernel
    # and in the panel's ban log, then released and looked for again
    - name: Ban a documentation address through the panel's jail
      ansible.builtin.command:
        argv: [fail2ban-client, set, 3x-ipl, banip, 203.0.113.9]
      changed_when: true

    - name: Read the kernel's set and the panel's ban log
      ansible.builtin.shell:
        cmd: nft list set inet f2b-table addr-set-3x-ipl; tail -1 /var/log/x-ui/3xipl-banned.log
      changed_when: false
      register: verify_ban

    - name: Release it again
      ansible.builtin.command:
        argv: [fail2ban-client, set, 3x-ipl, unbanip, 203.0.113.9]
      changed_when: true

    - name: Read the kernel's set after the release
      ansible.builtin.command:
        argv: [nft, list, set, inet, f2b-table, addr-set-3x-ipl]
      changed_when: false
      register: verify_unban

    - name: The ban reached the kernel and the log, and the release reached the kernel
      ansible.builtin.assert:
        that:
          - "'203.0.113.9' in verify_ban.stdout"
          - "'BAN 203.0.113.9' in verify_ban.stdout"
          - "'203.0.113.9' not in verify_unban.stdout"
        fail_msg: "ban: {{ verify_ban.stdout | trim }} / after release: {{ verify_unban.stdout | trim }}"

    - name: Read the firewall state
      ansible.builtin.command: ufw status verbose
      register: verify_ufw
      changed_when: false

    - name: Inbound is denied by default
      ansible.builtin.assert:
        that: "'deny (incoming)' in verify_ufw.stdout"
        fail_msg: "ufw default policy is not deny incoming: {{ verify_ufw.stdout }}"

    - name: Only the declared ports are open
      ansible.builtin.assert:
        that: item | string in verify_ufw.stdout
        fail_msg: "port {{ item }} was expected to be open and is not"
      loop: "{{ firewall_tcp_open }}"

    - name: The units that must survive a reboot are enabled
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      register: verify_units
      failed_when: verify_units.status.UnitFileState | default('') != 'enabled'
      loop:
        - x-ui
        - nginx
        - tailscaled

    - name: Port 80 answers like an ordinary site rather than staying silent
      ansible.builtin.uri:
        url: http://127.0.0.1/
        status_code: [301, 302]
        follow_redirects: none

    - name: Read the rest of the tuning the role claims to set
      ansible.builtin.command: sysctl -n {{ item }}
      loop:
        - net.core.rmem_max
        - net.ipv4.tcp_mtu_probing
        - net.ipv4.tcp_notsent_lowat
        - net.netfilter.nf_conntrack_max
      register: verify_tuning
      changed_when: false

    - name: Every declared key reached the kernel, not just the famous two
      ansible.builtin.assert:
        that:
          - verify_tuning.results[0].stdout == common_socket_buffer_max | string
          - verify_tuning.results[1].stdout == common_tcp_mtu_probing | string
          - verify_tuning.results[2].stdout == common_tcp_notsent_lowat | string
          - verify_tuning.results[3].stdout == common_conntrack_max | string
        fail_msg: >-
          a file can hold a value the kernel never took: rmem_max is
          {{ verify_tuning.results[0].stdout }}, conntrack_max is
          {{ verify_tuning.results[3].stdout }}

    - name: List every sysctl drop-in that could claim these keys
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail && grep -lE
          '^\s*net\.(core\.default_qdisc|ipv4\.tcp_congestion_control)'
          /etc/sysctl.conf /etc/sysctl.d/*.conf 2>/dev/null | sort
        executable: /bin/bash
      register: verify_declarers
      changed_when: false
      failed_when: false

    # Whichever file sorts last wins, silently. One declaration is the only
    # state in which the configured value and the effective value must agree
    - name: Exactly one file declares the congestion control
      ansible.builtin.assert:
        that: verify_declarers.stdout_lines | length == 1
        fail_msg: >-
          {{ verify_declarers.stdout_lines | length }} files set congestion control
          ({{ verify_declarers.stdout_lines | join(', ') }}); the last one read wins

    - name: Read the panel unit's own properties
      ansible.builtin.systemd_service:
        name: x-ui
      register: verify_xui_unit

    - name: The descriptor limit is a decision rather than a default
      ansible.builtin.assert:
        that: verify_xui_unit.status.LimitNOFILE | int == common_xui_nofile
        fail_msg: >-
          x-ui has LimitNOFILE={{ verify_xui_unit.status.LimitNOFILE }},
          expected {{ common_xui_nofile }}

    # Two default_server declarations is a fatal error, so the packaged site has
    # to be gone rather than merely overridden
    - name: The distribution's own site is not enabled beside ours
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: verify_packaged_site

    - name: Only this role serves port 80
      ansible.builtin.assert:
        that: not verify_packaged_site.stat.exists
        fail_msg: the packaged nginx site is still enabled and also claims port 80

    - name: Read the panel binding out of its database
      ansible.builtin.command:
        argv:
          - sqlite3
          - "{{ xui_db }}"
          - >-
            select coalesce(max(case when key='webPort' then value end), '') || '|' ||
                   coalesce(max(case when key='webBasePath' then value end), '') || '|' ||
                   coalesce(max(case when key='webListen' then value end), '')
            from settings
      register: verify_binding
      changed_when: false

    # The command that sets these cannot report whether it worked, and its
    # wrapper exits 0 for a subcommand it does not have
    - name: The panel took the binding it was given
      ansible.builtin.assert:
        that:
          - (verify_binding.stdout | trim).split('|') == [
              xui_panel_port | string, xui_base_path, xui_listen_ip]
        fail_msg: >-
          the database holds {{ verify_binding.stdout | trim }}, not
          {{ xui_panel_port }}|{{ xui_base_path }}|{{ xui_listen_ip }}

    # --- the metrics API -----------------------------------------------------
    #
    # No authentication, so where it listens is its whole security. Asked over
    # the stand-in tunnel interface, refused everywhere else, and back on its
    # own after the interface disappears and returns, the way tailscale0 does
    # on every tailscaled restart

    - name: Ask the API for its health on the tunnel address
      ansible.builtin.uri:
        url: "{{ verify_api }}/v1/health"
      register: verify_api_health

    - name: Ask the API on loopback, which is not the tunnel interface
      ansible.builtin.uri:
        url: http://127.0.0.1:{{ verify_metrics.metrics_api_port }}/v1/health
        timeout: 5
      register: verify_api_loopback
      failed_when: false

    - name: Ask the API for something it does not serve, and with a verb it refuses
      ansible.builtin.uri:
        url: "{{ verify_api }}{{ item.path }}"
        method: "{{ item.method }}"
        status_code: "{{ item.status }}"
      loop:
        - { path: /v1/export, method: GET, status: 404 }
        - { path: /v1/health, method: POST, status: 501 }

    - name: Read where the API port listens
      ansible.builtin.command:
        argv: [ss, -ltnH, "sport = :{{ verify_metrics.metrics_api_port }}"]
      register: verify_api_listeners
      changed_when: false

    # Both clauses: a socket listening nowhere would pass the second alone
    - name: The API answers on the tunnel interface alone
      ansible.builtin.assert:
        that:
          - verify_api_health.json.status == 'ok'
          - verify_api_loopback.status == -1
          - verify_api_listeners.stdout_lines | length > 0
          - >-
            verify_api_listeners.stdout_lines
            | reject('search', '%' ~ metrics_api_interface ~ ':' ~ verify_metrics.metrics_api_port ~ ' ')
            | list | length == 0
        fail_msg: >-
          health {{ verify_api_health.json | default('none') }}, loopback status
          {{ verify_api_loopback.status }}, listeners {{ verify_api_listeners.stdout_lines }}

    - name: Remove the stand-in tunnel interface, the way tailscaled does on a restart
      ansible.builtin.command:
        argv: [ip, link, del, "{{ metrics_api_interface }}"]
      changed_when: true

    - name: Read the socket's state without its interface
      ansible.builtin.command:
        argv: [systemctl, is-active, skibidi-metrics-api.socket]
      register: verify_api_gone
      changed_when: false
      failed_when: false
      retries: 10
      delay: 1
      until: verify_api_gone.stdout != 'active'

    - name: Bring the interface back
      ansible.builtin.shell:
        cmd: >-
          ip link add {{ metrics_api_interface }} type dummy &&
          ip addr add {{ metrics_host }}/32 dev {{ metrics_api_interface }} &&
          ip link set {{ metrics_api_interface }} up
        executable: /bin/bash
      changed_when: true

    - name: Ask the API again once the interface is back
      ansible.builtin.uri:
        url: "{{ verify_api }}/v1/health"
      register: verify_api_back
      retries: 15
      delay: 1
      until: verify_api_back.status == 200

    - name: The socket follows its interface away and back
      ansible.builtin.assert:
        that:
          - verify_api_gone.stdout != 'active'
          - verify_api_back.json.status == 'ok'
        fail_msg: "without the interface the socket was {{ verify_api_gone.stdout }}"

    - name: Read the store's modes and look for the old export account
      ansible.builtin.shell:
        cmd: >-
          stat -c '%a:%U:%G' {{ verify_metrics.metrics_db_dir }} {{ verify_metrics.metrics_db_dir }}/metrics.db;
          getent passwd skibidi-metrics || echo no-account
        executable: /bin/bash
      register: verify_store
      changed_when: false

    - name: The store is read by root and the reader group alone, and the SSH export is gone
      ansible.builtin.assert:
        that:
          - verify_store.stdout_lines == [
              '2750:root:' ~ verify_metrics.metrics_reader_group,
              '640:root:' ~ verify_metrics.metrics_reader_group,
              'no-account']
        fail_msg: "{{ verify_store.stdout_lines }}"

    # --- the letter that is gone ----------------------------------------------
    #
    # A deploy over a node that had the weekly letter removes it: the units,
    # the snapshots, and the command. This node never had them, so what is
    # asserted is that none is left, and the old command answers as an unknown

    - name: Look for what the letter had
      ansible.builtin.shell:
        cmd: >-
          ls /etc/systemd/system/skibidi-report.* /etc/systemd/system/skibidi-snapshot.*
          /var/lib/skibidi-report/snapshot-*.json 2>&1;
          /usr/local/sbin/skibidi-report send; echo "send exit $?"
        executable: /bin/bash
      register: verify_letter_gone
      changed_when: false
      failed_when: false

    - name: Nothing of the letter is left, and the command is not there
      ansible.builtin.assert:
        that:
          - verify_letter_gone.stdout_lines | select('search', 'No such file') | list | length == 3
          - "'send exit 2' in verify_letter_gone.stdout_lines"
        fail_msg: "{{ verify_letter_gone.stdout_lines }}"

    # --- the push -------------------------------------------------------------
    #
    # Through the unit, as the timer runs it, into a stub that refuses what the
    # station refuses. Judged on the stub's log: a request is a push, whatever
    # the collector says about it

    - name: Forget the pushes the deploy made
      ansible.builtin.file:
        path: "{{ station_dir }}-gateway/pushes.jsonl"
        state: absent
      changed_when: false

    - name: Collect and push through the unit
      ansible.builtin.systemd_service:
        name: skibidi-metrics.service
        state: started

    - name: Read the pushes the stub accepted
      ansible.builtin.slurp:
        src: "{{ station_dir }}-gateway/pushes.jsonl"
      register: verify_pushes

    - name: The node pushed its samples into its own group, with its own login
      vars:
        verify_push: "{{ (verify_pushes.content | b64decode).splitlines() | map('from_json') | list }}"
        verify_push_ok: "{{ verify_push | selectattr('status', 'equalto', 200) | list }}"
      ansible.builtin.assert:
        that:
          - verify_push_ok | length >= 1
          - verify_push | rejectattr('status', 'equalto', 200) | list | length == 0
          - verify_push_ok[-1].path == '/metrics/job/vpn/instance/' ~ inventory_hostname
          - verify_push_ok[-1].user == inventory_hostname
          - verify_push_ok[-1].method == 'PUT'
          - "'vpn_load1 ' in verify_push_ok[-1].body"
          - "'vpn_disk_used_ratio ' in verify_push_ok[-1].body"
          - "'node_problem' not in verify_push_ok[-1].body"
        fail_msg: "{{ verify_push | map(attribute='reason') | list }}"

    - name: Read what the collector's unit logged
      ansible.builtin.command:
        argv: [journalctl, --no-pager, -o, cat, -u, skibidi-metrics.service]
      register: verify_push_journal
      changed_when: false
      no_log: true

    - name: Read the file the units take the push target from
      ansible.builtin.slurp:
        src: "{{ verify_metrics.metrics_push_env_file }}"
      register: verify_push_env
      no_log: true

    - name: Neither the journal nor the target file names the password
      ansible.builtin.assert:
        that:
          - backup_secrets[inventory_hostname].rest_password not in verify_push_journal.stdout
          - backup_secrets[inventory_hostname].rest_password not in (verify_push_env.content | b64decode)
          - "'SKIBIDI_PUSH_BASE=http://' ~ station_address ~ ':9091' in (verify_push_env.content | b64decode)"
        fail_msg: the station's password is in the collector's journal or its target file
      no_log: true

    - name: The master pushes the panel's traffic through its own unit
      ansible.builtin.systemd_service:
        name: skibidi-traffic.service
        state: started

    - name: Read the state of the traffic unit
      ansible.builtin.command:
        argv: [systemctl, show, -p, Result, -p, ExecMainStatus, --value, skibidi-traffic.service]
      register: verify_traffic
      changed_when: false

    - name: The traffic unit ended well
      ansible.builtin.assert:
        that: verify_traffic.stdout_lines == ['success', '0'] or verify_traffic.stdout_lines == ['0', 'success']
        fail_msg: "{{ verify_traffic.stdout_lines }}"

    # The VM's panel has no clients, so the reporter wrote no file. A file in
    # its place stands for the traffic of a master with some: it rides in the
    # same body as the node's own samples, and leaves with the file
    - name: Put a traffic file where the reporter writes it
      ansible.builtin.copy:
        dest: "{{ verify_metrics.metrics_push_textfile }}"
        content: |
          # HELP vpn_client_traffic_bytes_total Bytes a client used, as the panel counts them
          # TYPE vpn_client_traffic_bytes_total counter
          vpn_client_traffic_bytes_total{client="Verifier",direction="up"} 5.0
        owner: root
        group: root
        mode: "0600"
      changed_when: false

    - name: Push with the traffic file in place
      ansible.builtin.systemd_service:
        name: skibidi-metrics.service
        state: started

    - name: Read the last accepted push
      ansible.builtin.slurp:
        src: "{{ station_dir }}-gateway/pushes.jsonl"
      register: verify_pushes_traffic

    - name: The traffic rides in the body of the node's own push
      vars:
        verify_push_last: "{{ (verify_pushes_traffic.content | b64decode).splitlines() | map('from_json') | selectattr('status', 'equalto', 200) | list | last }}"
      ansible.builtin.assert:
        that:
          - "'vpn_client_traffic_bytes_total{client=\"Verifier\",direction=\"up\"} 5.0' in verify_push_last.body"
          - "'vpn_load1 ' in verify_push_last.body"
        fail_msg: "{{ verify_push_last.body }}"

    - name: Take the traffic file away and push again
      ansible.builtin.file:
        path: "{{ verify_metrics.metrics_push_textfile }}"
        state: absent
      changed_when: false

    - name: Push without it
      ansible.builtin.systemd_service:
        name: skibidi-metrics.service
        state: started

    - name: Read the last accepted push again
      ansible.builtin.slurp:
        src: "{{ station_dir }}-gateway/pushes.jsonl"
      register: verify_pushes_nothing

    - name: The traffic left the group with the file
      vars:
        verify_push_last: "{{ (verify_pushes_nothing.content | b64decode).splitlines() | map('from_json') | selectattr('status', 'equalto', 200) | list | last }}"
      ansible.builtin.assert:
        that: "'vpn_client_traffic_bytes_total' not in verify_push_last.body"
        fail_msg: "{{ verify_push_last.body }}"

    # --- the daily check ------------------------------------------------------
    #
    # One list of everything still open, mailed only when there is something.
    # The failure the check would have left is planted in its record, because
    # a VM that is healthy by construction has nothing else to list

    - name: Read the daily timer
      ansible.builtin.command:
        argv: [systemctl, show, -p, TimersCalendar, -p, UnitFileState, skibidi-daily.timer]
      register: verify_daily_timer
      changed_when: false

    - name: The daily check is enabled for nine in Moscow
      ansible.builtin.assert:
        that:
          - "'09:00:00 Europe/Moscow' in verify_daily_timer.stdout"
          - "'UnitFileState=enabled' in verify_daily_timer.stdout"
        fail_msg: "{{ verify_daily_timer.stdout }}"

    - name: Plant a failure in the record the check leaves
      ansible.builtin.copy:
        dest: /var/lib/skibidi-check/failures
        content: "unit.planted.down{{ '%c' | format(9) }}planted failure for the verifier\n"
        owner: root
        group: root
        mode: "0640"
      changed_when: false

    # The same record, read by the push: the station hears the planted failure
    - name: Push again with the failure in the record
      ansible.builtin.systemd_service:
        name: skibidi-metrics.service
        state: started

    - name: Read the pushes the stub accepted since
      ansible.builtin.slurp:
        src: "{{ station_dir }}-gateway/pushes.jsonl"
      register: verify_pushes_after

    - name: The station was told of one problem, by its cause
      vars:
        verify_push_last: "{{ (verify_pushes_after.content | b64decode).splitlines() | map('from_json') | selectattr('status', 'equalto', 200) | list | last }}"
      ansible.builtin.assert:
        that: "'node_problem{key=\"unit.planted.down\",summary=\"planted failure for the verifier\"} 1.0' in verify_push_last.body"
        fail_msg: "{{ verify_push_last.body }}"

    # With the unit's settings and without its OnFailure: a run by hand must
    # see what the unit sees and must mail nothing
    - name: Run the daily check twice
      ansible.builtin.command:
        argv:
          - systemd-run
          - --quiet
          - --wait
          - --pipe
          - --property=EnvironmentFile=/etc/skibidi/daily.env
          - /usr/local/sbin/skibidi-daily
      register: verify_daily
      changed_when: false
      failed_when: false
      loop: [1, 2]

    - name: It lists the failure each time and says how many items are open
      ansible.builtin.assert:
        that:
          - verify_daily.results | map(attribute='rc') | list == [1, 1]
          - verify_daily.results[0].stdout_lines | select('equalto', 'FAIL planted failure for the verifier') | list | length == 1
          - verify_daily.results[1].stdout_lines | select('equalto', 'FAIL planted failure for the verifier') | list | length == 1
          - verify_daily.results[0].stdout_lines[-1] is search('^[0-9]+ unresolved item\(s\) on ')
        fail_msg: "{{ verify_daily.results | map(attribute='stdout_lines') | list | to_json }}"

    - name: Read where a failed daily run goes
      ansible.builtin.command:
        argv: [systemctl, show, -p, OnFailure, --value, skibidi-daily.service]
      register: verify_daily_failure
      changed_when: false

    - name: A run that cannot list still fails into the alert mail
      ansible.builtin.assert:
        that: verify_daily_failure.stdout == 'skibidi-alert@skibidi-daily.service'
        fail_msg: "{{ verify_daily_failure.stdout }}"

    # The whole way to the mailer: the unit runs, lists, mails the list from
    # its own unit and ends without failing. A sendmail ahead of the real one
    # on systemd's path captures the message
    - name: Point the alert at a recipient and a capturing sendmail
      ansible.builtin.copy:
        dest: "{{ item.dest }}"
        content: "{{ item.content }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { dest: /etc/skibidi/alert-to, content: "ops@example.test\n", mode: "0644" }
        - { dest: /usr/local/sbin/sendmail, content: "#!/bin/sh\ncat > /var/tmp/skibidi-daily.eml\n", mode: "0755" }
      changed_when: false

    - name: Run the daily unit, which lists the planted failure
      ansible.builtin.command:
        argv: [systemctl, start, skibidi-daily.service]
      register: verify_daily_unit
      changed_when: false
      failed_when: false

    - name: Ask whether the unit was left failed
      ansible.builtin.command:
        argv: [systemctl, is-failed, skibidi-daily.service]
      register: verify_daily_failed
      changed_when: false
      failed_when: false

    - name: Wait for the alert to reach the mailer
      ansible.builtin.wait_for:
        path: /var/tmp/skibidi-daily.eml
        timeout: 30

    - name: Read the mail
      ansible.builtin.slurp:
        src: /var/tmp/skibidi-daily.eml
      register: verify_daily_mail

    - name: The mail lists the open item as open, and the unit is not failed
      ansible.builtin.assert:
        that:
          - verify_daily_unit.rc == 0
          - verify_daily_failed.rc != 0
          - "'unresolved item(s)' in (verify_daily_mail.content | b64decode)"
          - "'planted failure for the verifier' in (verify_daily_mail.content | b64decode)"
          - "'lists open items' in (verify_daily_mail.content | b64decode)"
        fail_msg: "{{ verify_daily_mail.content | b64decode | truncate(600) }}"

    # --- a failed check: the station first, the mail as the fallback -----------
    #
    # The planted record stands for a failed check. The alert unit of a failed
    # check pushes at once, and mails only when that push fails

    - name: Forget the mail and the pushes so far
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/tmp/skibidi-daily.eml
        - "{{ station_dir }}-gateway/pushes.jsonl"
      changed_when: false

    - name: Alert about a failed check while the station is up
      ansible.builtin.command:
        argv: [systemctl, start, "skibidi-alert@skibidi-check.service"]
      changed_when: false

    - name: Look for a mail and read the pushes
      ansible.builtin.slurp:
        src: "{{ station_dir }}-gateway/pushes.jsonl"
      register: verify_alert_pushes

    - name: Look for the mail
      ansible.builtin.stat:
        path: /var/tmp/skibidi-daily.eml
      register: verify_alert_mail_up

    - name: The station was told within the alert, and nothing was mailed
      vars:
        verify_push_last: "{{ (verify_alert_pushes.content | b64decode).splitlines() | map('from_json') | selectattr('status', 'equalto', 200) | list | last }}"
      ansible.builtin.assert:
        that:
          - "'node_problem{key=\"unit.planted.down\"' in verify_push_last.body"
          - not verify_alert_mail_up.stat.exists
        fail_msg: "{{ verify_push_last.body }}"

    - name: Take the station down
      ansible.builtin.systemd_service:
        name: station-pushgateway
        state: stopped

    - name: Alert about a failed check while the station is down
      ansible.builtin.command:
        argv: [systemctl, start, "skibidi-alert@skibidi-check.service"]
      changed_when: false

    - name: Look for the mail the fallback sends
      ansible.builtin.wait_for:
        path: /var/tmp/skibidi-daily.eml
        timeout: 30

    - name: Bring the station back
      ansible.builtin.systemd_service:
        name: station-pushgateway
        state: started

    - name: Put the alert back the way the scenario set it
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/skibidi/alert-to
        - /usr/local/sbin/sendmail
        - /var/tmp/skibidi-daily.eml
      changed_when: false

    # The record is the check's to write: running it replaces the planted line
    # with whatever is really open, and the daily check must follow
    - name: Let the check rewrite its record
      ansible.builtin.command:
        argv: [/usr/local/sbin/skibidi-check]
      changed_when: false
      failed_when: false

    - name: Run the daily check again
      ansible.builtin.command:
        argv:
          - systemd-run
          - --quiet
          - --wait
          - --pipe
          - --property=EnvironmentFile=/etc/skibidi/daily.env
          - /usr/local/sbin/skibidi-daily
      register: verify_daily_after
      changed_when: false
      failed_when: verify_daily_after.rc not in [0, 1]

    - name: The planted failure is gone once the check has run
      ansible.builtin.assert:
        that: "'planted failure' not in verify_daily_after.stdout"
        fail_msg: "{{ verify_daily_after.stdout_lines }}"

    # --- the backup ----------------------------------------------------------
    #
    # Pushed for real to the rest-server converge started, and judged on the
    # station's own disk: a snapshot file that arrives there is a push, whatever
    # the client says about it

    - name: Read the backup timer
      ansible.builtin.systemd_service:
        name: skibidi-backup.timer
      register: verify_backup_timer

    - name: The backup timer is installed, enabled and waiting
      ansible.builtin.assert:
        that:
          - verify_backup_timer.status.LoadState == 'loaded'
          - verify_backup_timer.status.UnitFileState == 'enabled'
          - verify_backup_timer.status.ActiveState == 'active'
        fail_msg: >-
          skibidi-backup.timer is {{ verify_backup_timer.status.LoadState }},
          {{ verify_backup_timer.status.UnitFileState | default('no unit file') }},
          {{ verify_backup_timer.status.ActiveState }}

    - name: Count the snapshots on the station's disk
      ansible.builtin.find:
        paths: "{{ verify_snapshots }}"
      register: verify_snapshots_before

    - name: Push a backup through the unit
      ansible.builtin.systemd_service:
        name: skibidi-backup.service
        state: started

    - name: Count the snapshots on the station's disk again
      ansible.builtin.find:
        paths: "{{ verify_snapshots }}"
      register: verify_snapshots_after

    - name: The push left one more snapshot on the station
      ansible.builtin.assert:
        that: verify_snapshots_after.matched == verify_snapshots_before.matched + 1
        fail_msg: >-
          the station held {{ verify_snapshots_before.matched }} snapshot(s) before the push
          and {{ verify_snapshots_after.matched }} after it

    # The panel's database and the metric store, each with a table only the
    # real store has: an empty file passes an integrity check too
    - name: Read the staged copies back
      ansible.builtin.command:
        argv: [sqlite3, "{{ verify_staging }}{{ item.store }}", "pragma integrity_check; select count(*) > 0 from {{ item.table }};"]
      loop:
        - { store: "{{ xui_db }}", table: settings }
        - { store: "{{ verify_metrics.metrics_db_dir }}/metrics.db", table: samples }
      register: verify_staged
      changed_when: false
      failed_when: false

    - name: Each staged copy is a whole SQLite store with its data in it
      ansible.builtin.assert:
        that: item.rc == 0 and item.stdout_lines == ['ok', '1']
        fail_msg: "{{ item.item.store }}: rc {{ item.rc }}, {{ item.stdout_lines + item.stderr_lines }}"
      loop: "{{ verify_staged.results }}"
      loop_control:
        label: "{{ item.item.store }}"

    - name: Read the modes of the secrets and the copies
      ansible.builtin.shell:
        cmd: >-
          stat -c '%a:%U:%G' {{ verify_backup.backup_config_dir }}/rest-password
          {{ verify_backup.backup_config_dir }}/repository-password;
          find {{ verify_backup.backup_config_dir }} {{ verify_backup.backup_state_dir }}
          \( -perm /077 -o ! -user root \)
        executable: /bin/bash
      register: verify_backup_modes
      changed_when: false

    - name: The secrets and the staged copies are readable by root alone
      ansible.builtin.assert:
        that: verify_backup_modes.stdout_lines == ['600:root:root', '600:root:root']
        fail_msg: "{{ verify_backup_modes.stdout_lines }}"

    # What any local account can read about the unit, and what the journal
    # kept of every run so far. The values are the scenario's own passwords;
    # the registered output is hidden, because a leak would print them
    - name: Read the unit's properties
      ansible.builtin.systemd_service:
        name: skibidi-backup.service
      register: verify_backup_unit
      no_log: true

    - name: Read the unit's files, the script and the journal
      ansible.builtin.shell:
        cmd: >-
          cat /etc/systemd/system/skibidi-backup.service /etc/systemd/system/skibidi-backup.timer
          {{ verify_backup.backup_script }};
          journalctl --no-pager -o cat -u skibidi-backup.service
        executable: /bin/bash
      register: verify_backup_files
      changed_when: false
      no_log: true

    - name: Neither password appears outside its root-only file
      vars:
        verify_backup_public: "{{ verify_backup_unit.status | to_json }}{{ verify_backup_files.stdout }}"
      ansible.builtin.assert:
        that:
          - "'pushed a snapshot' in verify_backup_public"
          - "'skibidi-backup run' in verify_backup_public"
          - backup_secrets[inventory_hostname].rest_password not in verify_backup_public
          - backup_secrets[inventory_hostname].repository_password not in verify_backup_public
        fail_msg: a backup password is in the unit, the script or the journal, or the journal holds no push at all
      no_log: true

    # Append-only is the station's promise; this asks the server with the
    # node's own credentials, the way a node in someone else's hands would
    - name: Ask the station, as the node, to forget the newest snapshot
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          export RESTIC_REST_PASSWORD; RESTIC_REST_PASSWORD=$(cat {{ verify_backup.backup_config_dir }}/rest-password);
          id=$({{ verify_backup.backup_restic_path }} snapshots --json --latest 1
          | python3 -c 'import json, sys; print(json.load(sys.stdin)[-1]["id"])');
          {{ verify_backup.backup_restic_path }} forget "$id"
        executable: /bin/bash
      environment:
        RESTIC_REPOSITORY: rest:{{ backup_url }}/{{ inventory_hostname }}/
        RESTIC_REST_USERNAME: "{{ inventory_hostname }}"
        RESTIC_PASSWORD_FILE: "{{ verify_backup.backup_config_dir }}/repository-password"
        RESTIC_CACHE_DIR: "{{ verify_backup.backup_cache_dir }}"
      register: verify_forget
      changed_when: false
      failed_when: false

    - name: Count the snapshots on the station's disk after the attempt
      ansible.builtin.find:
        paths: "{{ verify_snapshots }}"
      register: verify_snapshots_kept

    # Both clauses: restic must have reached the server and been refused, and
    # the file must still be there. A forget that never ran fails the first
    - name: The station refused the delete and kept the snapshot
      ansible.builtin.assert:
        that:
          - verify_forget.rc != 0
          - "'403' in verify_forget.stderr"
          - verify_snapshots_kept.matched == verify_snapshots_after.matched
        fail_msg: >-
          forget exited {{ verify_forget.rc }} ({{ verify_forget.stderr_lines[-3:] }}); the
          station holds {{ verify_snapshots_kept.matched }} of {{ verify_snapshots_after.matched }}

    - name: Run the node's own checks
      ansible.builtin.command:
        argv: [/usr/local/sbin/skibidi-check]
      register: verify_backup_check
      changed_when: false
      failed_when: false

    - name: The checker watches the backup and passes
      ansible.builtin.assert:
        that:
          - verify_backup_check.rc == 0
          - verify_backup_check.stdout_lines | select('search', '^ok +the backup timer is enabled') | list | length == 1
          - verify_backup_check.stdout_lines | select('search', '^ok +skibidi-backup\.timer (fired|has not fired)') | list | length == 1
          - verify_backup_check.stdout_lines | select('search', '^ok +the backup station .* inside the tunnel, where plain HTTP is allowed') | list | length == 1
          - verify_backup_check.stdout_lines | select('search', '^ok +the backup secrets .* root alone') | list | length == 1
        fail_msg: "{{ verify_backup_check.stdout_lines | select('search', '^FAIL|backup') | list }}"

    # A registry edit that points the node at plain HTTP off the tunnel. The
    # address is a documentation one, so nothing could answer it anyway: the
    # refusal has to come from the guard, before restic is asked
    - name: Deploy the backup towards plain HTTP outside the tunnel
      block:
        - name: Run the role with an http:// station outside the tunnel ranges
          ansible.builtin.include_role:
            name: backup
          vars:
            backup_url: http://198.51.100.7:8000
            backup_tunnel_ranges: "{{ verify_metrics.metrics_tunnel_ranges }}"

        - name: The deploy went on past the refused station
          ansible.builtin.fail:
            msg: the backup role accepted plain HTTP to a station outside the tunnel
      rescue:
        - name: The deploy stopped at the guard, which names the way out
          ansible.builtin.assert:
            that:
              - "'outside the tunnel' in ansible_failed_result.stderr | default('')"
              - "'https://' in ansible_failed_result.stderr | default('')"
            fail_msg: "{{ ansible_failed_result.msg | default('') }} {{ ansible_failed_result.stderr | default('') }}"

    # The skip path, last because it takes the backup away: the same role with
    # no station leaves no unit, no secret and no copy behind
    - name: Take the station out of the node's configuration
      ansible.builtin.include_role:
        name: backup
      vars:
        backup_url: ""

    - name: Look for anything the backup left
      ansible.builtin.shell:
        cmd: >-
          ls -d /etc/systemd/system/skibidi-backup.* {{ verify_backup.backup_config_dir }} {{ verify_backup.backup_state_dir }}
          {{ verify_backup.backup_cache_dir }} {{ verify_backup.backup_script }}
          {{ verify_backup.backup_restic_path }} 2>/dev/null;
          true
        executable: /bin/bash
      register: verify_backup_left
      changed_when: false

    - name: Nothing of the backup is left on a node that names no station
      ansible.builtin.assert:
        that: verify_backup_left.stdout | trim | length == 0
        fail_msg: "{{ verify_backup_left.stdout_lines }}"

    - name: Let systemd forget the removed units
      ansible.builtin.meta: flush_handlers

    # The checker on the VM was rendered for a node with a station, so its own
    # backup section still asks. What this proves is the shared timer loop: it
    # skips a watched timer that is not installed instead of failing on it. The
    # section itself renders to nothing without a station, in tests/test_backup.py
    - name: Run the node's own checks without the backup
      ansible.builtin.command:
        argv: [/usr/local/sbin/skibidi-check]
      register: verify_unbacked_check
      changed_when: false
      failed_when: false

    - name: The timer loop says nothing about a timer that is not installed
      ansible.builtin.assert:
        that: verify_unbacked_check.stdout_lines | select('search', 'skibidi-backup\.timer') | list | length == 0
        fail_msg: "{{ verify_unbacked_check.stdout_lines | select('search', 'skibidi-backup') | list }}"

    # And back, so the scenario can be verified again without a converge. The
    # repository is still on the station, so this also proves a second init
    # finds it rather than failing
    - name: Name the station again
      ansible.builtin.include_role:
        name: backup
      vars:
        backup_tunnel_ranges: "{{ verify_metrics.metrics_tunnel_ranges }}"

    - name: The backup is back and found its repository
      ansible.builtin.assert:
        that:
          - backup_init is not changed
          - "'the repository exists' in backup_init.stdout"
        fail_msg: "{{ backup_init.stdout | default('init did not run') }}"

    # --- the observer -----------------------------------------------------------
    #
    # What the observer does as itself, rather than what sudo -l says it may: a
    # rule that sudo accepts and a command that then fails look the same to -l

    - name: Read the journal and fail2ban's log as the observer
      ansible.builtin.command:
        argv: [runuser, -u, observer, --, bash, -c, "journalctl -q -n 1 && head -n 1 /var/log/fail2ban.log"]
      register: verify_observer_logs
      changed_when: false

    - name: The observer reads the logs
      ansible.builtin.assert:
        that:
          - verify_observer_logs.stdout_lines | length == 2
          - "'insufficient permissions' not in verify_observer_logs.stderr"
        fail_msg: "{{ verify_observer_logs.stdout }} {{ verify_observer_logs.stderr }}"

    - name: Ask fail2ban for its jails as the observer
      ansible.builtin.command:
        argv: [runuser, -u, observer, --, sudo, -n, /usr/bin/fail2ban-client, status]
      register: verify_observer_jails
      changed_when: false

    - name: The observer gets an answer from fail2ban
      ansible.builtin.assert:
        that: "'Jail list' in verify_observer_jails.stdout"
        fail_msg: "{{ verify_observer_jails.stdout }}"

    # Each one exits non-zero when it is refused, and changes nothing that the
    # rest of this scenario reads when it is not
    - name: Try what an observer must not do
      ansible.builtin.command:
        argv: "{{ ['runuser', '-u', 'observer', '--'] + item }}"
      loop:
        - [cat, "{{ xui_db }}"]
        - [cat, /usr/local/x-ui/bin/config.json]
        - [sudo, -n, /usr/bin/true]
        - [sudo, -n, /usr/bin/fail2ban-client, status, sshd]
        - [sudo, -n, /usr/bin/ss, -tlnpu, -K]
      register: verify_observer_refused
      changed_when: false
      failed_when: verify_observer_refused.rc == 0

    - name: Take the observer out of the node's configuration
      ansible.builtin.include_role:
        name: observers
      vars:
        observers_users: []

    - name: Look for the observer and its rules
      ansible.builtin.shell:
        cmd: "getent passwd observer; ls /etc/sudoers.d/skibidi-observers /home/observer 2>/dev/null; true"
      register: verify_observer_left
      changed_when: false

    - name: Nothing of the observer is left
      ansible.builtin.assert:
        that: verify_observer_left.stdout | length == 0
        fail_msg: "{{ verify_observer_left.stdout }}"

    # And back, so the scenario can be verified again without a converge
    - name: Name the observer again
      ansible.builtin.include_role:
        name: observers
