---
# What the roles claim, asserted against the running machine rather than against
# the modules' own return values. Every assertion here is one that has a
# plausible way of being false on a real node.
- name: Verify the node came out the way the roles describe
  hosts: all
  gather_facts: true

  # The verifier runs no roles, so their defaults are not in scope, and reading
  # the same file the role reads is what keeps an assertion from becoming a copy
  # that drifts. Only common is loaded this way: vars_files outrank inventory
  # host_vars, so loading the others would silently replace the values this
  # scenario sets for the VM with the role's own defaults, and the checks would
  # compare the machine against something nobody deployed.
  vars_files:
    - ../../roles/common/defaults/main.yml

  tasks:
    - name: Read the effective congestion control and queue discipline
      ansible.builtin.command: sysctl -n {{ item }}
      loop:
        - net.ipv4.tcp_congestion_control
        - net.core.default_qdisc
      register: verify_sysctl
      changed_when: false

    - name: The kernel actually uses what was configured
      ansible.builtin.assert:
        that:
          - verify_sysctl.results[0].stdout == common_congestion_control
          - verify_sysctl.results[1].stdout == common_qdisc
        fail_msg: >-
          sysctl reports {{ verify_sysctl.results[0].stdout }}/{{ verify_sysctl.results[1].stdout }};
          a setting written to a file the module never applied looks identical in the diff

    - name: Read the listening sockets
      ansible.builtin.command: ss -ltnH
      register: verify_sockets
      changed_when: false

    # The panel holds every client secret and the Reality private keys. A public
    # bind is the one failure that cannot be walked back after it is noticed.
    # Both clauses: a panel that is not listening at all would otherwise pass
    - name: The panel listens on the tunnel address and nowhere else
      ansible.builtin.assert:
        that:
          - verify_sockets.stdout_lines | select('search', ':' ~ xui_panel_port) | list | length > 0
          - >-
            verify_sockets.stdout_lines
            | select('search', ':' ~ xui_panel_port)
            | reject('search', xui_listen_ip)
            | list | length == 0
        fail_msg: "panel port {{ xui_panel_port }} answers somewhere other than {{ xui_listen_ip }}, or not at all"

    # Every file under the panel's directory carries the client secrets, the
    # backups included. Readable beyond root is the thing the role closes
    - name: Look for anything under the panel's directory readable beyond root
      ansible.builtin.shell:
        cmd: >-
          find {{ xui_db | dirname }} -maxdepth 1 \( -perm -o+r -o -perm -g+r \)
          \( -type d -o -name "{{ xui_db | basename }}*" \)
        executable: /bin/bash
      register: verify_db_perms
      changed_when: false

    - name: The database and its copies are readable by root alone
      ansible.builtin.assert:
        that: verify_db_perms.stdout | trim | length == 0
        fail_msg: "readable beyond root: {{ verify_db_perms.stdout_lines | join(', ') }}"

    # A jail can be loaded and green while reading the journal instead of the
    # file its filter was written for; the file it holds open is the proof
    - name: Ask fail2ban which file the panel's jail opened
      ansible.builtin.command:
        argv: [fail2ban-client, get, 3x-ipl, logpath]
      register: verify_ipl_logpath
      changed_when: false

    - name: The panel's jail reads the panel's log
      ansible.builtin.assert:
        that: "'/var/log/x-ui/3xipl.log' in verify_ipl_logpath.stdout"
        fail_msg: "the 3x-ipl jail opened {{ verify_ipl_logpath.stdout | trim or 'nothing' }}"

    # A real ban, end to end: an address from the documentation range, which
    # is never routed, is banned through fail2ban and looked for in the kernel
    # and in the panel's ban log, then released and looked for again
    - name: Ban a documentation address through the panel's jail
      ansible.builtin.command:
        argv: [fail2ban-client, set, 3x-ipl, banip, 203.0.113.9]
      changed_when: true

    - name: Read the kernel's set and the panel's ban log
      ansible.builtin.shell:
        cmd: nft list set inet f2b-table addr-set-3x-ipl; tail -1 /var/log/x-ui/3xipl-banned.log
      changed_when: false
      register: verify_ban

    - name: Release it again
      ansible.builtin.command:
        argv: [fail2ban-client, set, 3x-ipl, unbanip, 203.0.113.9]
      changed_when: true

    - name: Read the kernel's set after the release
      ansible.builtin.command:
        argv: [nft, list, set, inet, f2b-table, addr-set-3x-ipl]
      changed_when: false
      register: verify_unban

    - name: The ban reached the kernel and the log, and the release reached the kernel
      ansible.builtin.assert:
        that:
          - "'203.0.113.9' in verify_ban.stdout"
          - "'BAN 203.0.113.9' in verify_ban.stdout"
          - "'203.0.113.9' not in verify_unban.stdout"
        fail_msg: "ban: {{ verify_ban.stdout | trim }} / after release: {{ verify_unban.stdout | trim }}"

    - name: Read the firewall state
      ansible.builtin.command: ufw status verbose
      register: verify_ufw
      changed_when: false

    - name: Inbound is denied by default
      ansible.builtin.assert:
        that: "'deny (incoming)' in verify_ufw.stdout"
        fail_msg: "ufw default policy is not deny incoming: {{ verify_ufw.stdout }}"

    - name: Only the declared ports are open
      ansible.builtin.assert:
        that: item | string in verify_ufw.stdout
        fail_msg: "port {{ item }} was expected to be open and is not"
      loop: "{{ firewall_tcp_open }}"

    - name: The units that must survive a reboot are enabled
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      register: verify_units
      failed_when: verify_units.status.UnitFileState | default('') != 'enabled'
      loop:
        - x-ui
        - nginx
        - tailscaled

    - name: Port 80 answers like an ordinary site rather than staying silent
      ansible.builtin.uri:
        url: http://127.0.0.1/
        status_code: [301, 302]
        follow_redirects: none

    - name: Read the rest of the tuning the role claims to set
      ansible.builtin.command: sysctl -n {{ item }}
      loop:
        - net.core.rmem_max
        - net.ipv4.tcp_mtu_probing
        - net.ipv4.tcp_notsent_lowat
        - net.netfilter.nf_conntrack_max
      register: verify_tuning
      changed_when: false

    - name: Every declared key reached the kernel, not just the famous two
      ansible.builtin.assert:
        that:
          - verify_tuning.results[0].stdout == common_socket_buffer_max | string
          - verify_tuning.results[1].stdout == common_tcp_mtu_probing | string
          - verify_tuning.results[2].stdout == common_tcp_notsent_lowat | string
          - verify_tuning.results[3].stdout == common_conntrack_max | string
        fail_msg: >-
          a file can hold a value the kernel never took: rmem_max is
          {{ verify_tuning.results[0].stdout }}, conntrack_max is
          {{ verify_tuning.results[3].stdout }}

    - name: List every sysctl drop-in that could claim these keys
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail && grep -lE
          '^\s*net\.(core\.default_qdisc|ipv4\.tcp_congestion_control)'
          /etc/sysctl.conf /etc/sysctl.d/*.conf 2>/dev/null | sort
        executable: /bin/bash
      register: verify_declarers
      changed_when: false
      failed_when: false

    # Whichever file sorts last wins, silently. One declaration is the only
    # state in which the configured value and the effective value must agree
    - name: Exactly one file declares the congestion control
      ansible.builtin.assert:
        that: verify_declarers.stdout_lines | length == 1
        fail_msg: >-
          {{ verify_declarers.stdout_lines | length }} files set congestion control
          ({{ verify_declarers.stdout_lines | join(', ') }}); the last one read wins

    - name: Read the panel unit's own properties
      ansible.builtin.systemd_service:
        name: x-ui
      register: verify_xui_unit

    - name: The descriptor limit is a decision rather than a default
      ansible.builtin.assert:
        that: verify_xui_unit.status.LimitNOFILE | int == common_xui_nofile
        fail_msg: >-
          x-ui has LimitNOFILE={{ verify_xui_unit.status.LimitNOFILE }},
          expected {{ common_xui_nofile }}

    # Two default_server declarations is a fatal error, so the packaged site has
    # to be gone rather than merely overridden
    - name: The distribution's own site is not enabled beside ours
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: verify_packaged_site

    - name: Only this role serves port 80
      ansible.builtin.assert:
        that: not verify_packaged_site.stat.exists
        fail_msg: the packaged nginx site is still enabled and also claims port 80

    - name: Read the panel binding out of its database
      ansible.builtin.command:
        argv:
          - sqlite3
          - "{{ xui_db }}"
          - >-
            select coalesce(max(case when key='webPort' then value end), '') || '|' ||
                   coalesce(max(case when key='webBasePath' then value end), '') || '|' ||
                   coalesce(max(case when key='webListen' then value end), '')
            from settings
      register: verify_binding
      changed_when: false

    # The command that sets these cannot report whether it worked, and its
    # wrapper exits 0 for a subcommand it does not have
    - name: The panel took the binding it was given
      ansible.builtin.assert:
        that:
          - (verify_binding.stdout | trim).split('|') == [
              xui_panel_port | string, xui_base_path, xui_listen_ip]
        fail_msg: >-
          the database holds {{ verify_binding.stdout | trim }}, not
          {{ xui_panel_port }}|{{ xui_base_path }}|{{ xui_listen_ip }}

    # --- the weekly letter ----------------------------------------------------
    #
    # Sent for real, into a stub that keeps the bytes: what is asserted below is
    # the exact message a Monday would hand to sendmail, not a rendering of it

    - name: Install a sendmail that captures instead of mailing
      ansible.builtin.copy:
        dest: /usr/local/sbin/capture-sendmail
        content: |
          #!/bin/sh
          cat > /var/tmp/skibidi-letter.eml
        owner: root
        group: root
        mode: "0755"
      changed_when: false

    # A letter left by an earlier run would let a send that silently did
    # nothing pass every assertion below
    - name: Forget any letter a previous run captured
      ansible.builtin.file:
        path: /var/tmp/skibidi-letter.eml
        state: absent
      changed_when: false

    - name: Send the letter into the stub
      ansible.builtin.command:
        argv: [/usr/local/sbin/skibidi-report, send]
      changed_when: false

    - name: Read the captured letter apart
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import email, email.policy, re, sys
            with open("/var/tmp/skibidi-letter.eml", "rb") as handle:
                message = email.message_from_binary_file(handle, policy=email.policy.default)
            body = next(part for part in message.walk()
                        if part.get_content_type() == "text/html").get_content()
            referenced = set(re.findall(r'src="cid:([^"]+)"', body))
            attached = {part["Content-ID"].strip("<>") for part in message.walk()
                        if part.get_content_type() == "image/png"}
            problems = []
            if not message["Subject"] or "Weekly VPN report" not in message["Subject"]:
                problems.append(f"subject is {message['Subject']!r}")
            if message.get_content_type() != "multipart/alternative":
                problems.append(f"outer type is {message.get_content_type()}")
            if "<pre" in body or "<style" in body:
                problems.append("the HTML carries a <pre> or <style> block")
            if referenced != attached:
                problems.append(f"cid mismatch: referenced {referenced}, attached {attached}")
            if message["Auto-Submitted"] != "auto-generated":
                problems.append("not marked auto-generated")
            text = next((part for part in message.walk()
                         if part.get_content_type() == "text/plain"), None)
            if text is None or not text.get_content().strip():
                problems.append("the text/plain alternative is missing or empty; "
                                "a client without HTML sees nothing")
            print("; ".join(problems) if problems else "letter ok")
            sys.exit(1 if problems else 0)
      register: verify_letter
      changed_when: false
      # The assert below owns the verdict; failing here would swallow the
      # problem list and report only a return code
      failed_when: false

    - name: The letter is whole
      ansible.builtin.assert:
        that: verify_letter.rc == 0
        fail_msg: "{{ verify_letter.stdout }}"
