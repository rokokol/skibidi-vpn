---
# A real Ubuntu VM, not a container: systemd, ufw and sysctl are three of the
# things worth testing here, and none of them behave inside a container - a
# container shares the host's kernel, so a sysctl test would either fail or,
# worse, change the host.
#
# The VM is driven by QEMU directly rather than through Vagrant. Vagrant's
# libvirt provider is a Ruby plugin that nixpkgs does not package, and building
# it inside the dev shell is exactly the kind of dependency that rots.
driver:
  name: default
  options:
    # managed means this scenario supplies create.yml and destroy.yml, and tells
    # molecule where the machine ended up through the instance config file it
    # writes. The port is therefore chosen at boot rather than written here: a
    # fixed one collides with a second run, or with a VM left behind by a
    # crashed one, and fails during create complaining that SSH does not answer
    managed: true
    ansible_connection_options:
      ansible_connection: ssh
      ansible_ssh_common_args: >-
        -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        -o IdentitiesOnly=yes

platforms:
  - name: skibidi-node

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../roles
    ANSIBLE_HOST_KEY_CHECKING: "false"
  inventory:
    host_vars:
      skibidi-node:
        ansible_become: true
        # No tunnel in the VM, so the panel binds to loopback. The assertion
        # still means something: it proves the panel is not on 0.0.0.0
        xui_listen_ip: "127.0.0.1"
        xui_panel_port: 2053
        xui_base_path: "/molecule/"
        # There is no tailscale0 here, and no tailnet to hide a direct path from
        firewall_tunnel_interface: lo
        firewall_hide_tailscale_direct: false
        certs_domain: ""
        # Stated here rather than pulled from the role defaults, because the
        # verifier needs them and vars_files would outrank everything above
        firewall_tcp_open: [22, 80, 443]
        xui_db: /etc/x-ui/x-ui.db
        # No tunnel to a master and no mail relay reachable from here. Both are
        # empty rather than pointed somewhere fake: a check against a stub
        # proves the stub works
        checker_master_url: ""
        checker_smtp: ""
        checker_alert_to: ""
        # tailscaled is installed but never joins a tailnet in the VM, so it is
        # not among the units whose health means anything here
        checker_required_units: [x-ui, nginx, fail2ban]
        # The letter is built against the VM's own panel and captured by a
        # stub instead of mailed: what the verifier reads is the exact bytes
        # a Monday would send
        reporter_to: report@example.test
        reporter_sendmail: /usr/local/sbin/capture-sendmail
        metrics_watched_units: [x-ui, nginx, fail2ban]
        # A dummy interface stands in for tailscale0, created by converge
        # before the roles: it has a device unit the way tailscale0 does, so
        # the socket's binding and its return after the interface comes back
        # are tested for real. The address is inside the tunnel ranges
        metrics_api_interface: skibidi0
        metrics_host: "100.64.0.1"
        # The station is a real rest-server inside the VM, append-only with
        # private repositories, started by converge on a second dummy
        # interface. Its address is inside the tunnel ranges, so the script's
        # guard and the checker accept plain HTTP to it, as on the tailnet
        station_address: "100.64.0.2"
        backup_url: "http://100.64.0.2:8000"
        station_interface: station0
        station_dir: /srv/station
        # The VM runs the reporter the way a master does
        backup_report_state: true
        # Generated once per run into molecule's directory and read back by
        # the verifier, so no literal sits here. Punctuation is in both on
        # purpose: the script must hand either one over untouched
        backup_secrets:
          skibidi-node:
            rest_password: >-
              {{ lookup('ansible.builtin.password',
                 lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') ~ '/backup-rest-password',
                 length=32, chars=['ascii_letters', 'digits', 'punctuation']) }}
            repository_password: >-
              {{ lookup('ansible.builtin.password',
                 lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') ~ '/backup-repository-password',
                 length=32, chars=['ascii_letters', 'digits', 'punctuation']) }}

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - create
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
