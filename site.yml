---
- name: Build and maintain the VPN nodes
  hosts: nodes
  become: "{{ ansible_become | default(false) }}"
  roles:
    - common
    # Before the firewall: the firewall reads the port the daemon was installed
    # with, and on a fresh node the daemon has to exist for that to be a check
    - tailscale
    - firewall
    - xui
    # After the panel, which owns the directory the databases live in, and
    # before the checker, which watches the timer this role installs
    - geodata
    - fail2ban
    - role: certs
      when: certs_domain | default('') | length > 0
    - nginx
    - metrics
    - role: reporter
      when: "'master' in group_names and reporter_to | length > 0"
    # After every role whose store it copies, and before the checker, which
    # watches its timer. Not gated here: a node with no station runs it to
    # remove what an earlier deploy installed
    - backup
    - checker

# Last and on its own: switching Tailscale SSH can take over the SSH session a
# play rides on the tailnet address, so nothing may run after it
- name: Switch Tailscale SSH to what each node declares
  hosts: nodes
  become: "{{ ansible_become | default(false) }}"
  tasks:
    - name: Switch Tailscale SSH
      ansible.builtin.include_role:
        name: tailscale
        tasks_from: ssh
