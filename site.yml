---
- name: Build and maintain the VPN nodes
  hosts: nodes
  become: "{{ ansible_become | default(false) }}"
  roles:
    - common
    # Before the firewall: the firewall reads the port the daemon was installed
    # with, and on a fresh node the daemon has to exist for that to be a check
    - tailscale
    - firewall
    - xui
    # After the panel, which owns the directory the databases live in, and
    # before the checker, which watches the timer this role installs
    - geodata
    - fail2ban
    - role: certs
      when: certs_domain | default('') | length > 0
    - nginx
    - metrics
    - role: reporter
      when: "'master' in group_names and reporter_to | length > 0"
    - checker
