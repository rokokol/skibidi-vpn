---
- name: Add the Tailscale apt key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"

- name: Add the Tailscale repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: [deb]
    uris: https://pkgs.tailscale.com/stable/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: [main]
    signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
    state: present

- name: Install tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Start tailscaled
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started

- name: Report whether this node is already on the tailnet
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

# Joining is the one step that needs a secret, so it runs only when the node is
# not already a member — re-running the play must not require the key
- name: Join the tailnet
  ansible.builtin.command: >-
    tailscale up
    --authkey {{ tailscale_auth_key }}
    --hostname {{ tailscale_hostname }}
    --accept-routes={{ tailscale_accept_routes | lower }}
    --ssh={{ tailscale_ssh | lower }}
  when:
    - tailscale_auth_key | length > 0
    - (tailscale_status.stdout | default('{}') | from_json).BackendState | default('') != 'Running'
  changed_when: true
  no_log: true
