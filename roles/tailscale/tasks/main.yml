---
# The key decides which packages apt will trust, so it is carried in the
# repository rather than fetched: a download can only be checked against a
# digest that is itself pinned here, and at that point the bytes may as well
# be. Tailscale signs every Ubuntu release with the same key (noble and jammy
# serve identical files); a rotation shows up as a diff in this file
- name: Install the Tailscale apt key
  ansible.builtin.copy:
    src: tailscale-archive-keyring.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"

# deb822_repository parses sources with python3-debian and refuses to run at all
# in check mode without it - and it will not install it in check mode either, so
# a dry run against a host that has never had the package cannot get past this
# task. Installing it as its own step breaks that circle from the first real run
- name: Install what the repository module parses with
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
    # Refresh only if no other role did it in the last hour: five roles each
    # pulling the indexes turns a one-minute play into five minutes of the same
    # download
    cache_valid_time: 3600

- name: Add the Tailscale repository
  ansible.builtin.deb822_repository:
    name: tailscale
    install_python_debian: true
    types: [deb]
    uris: https://pkgs.tailscale.com/stable/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: [main]
    signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
    state: present

# No cache_valid_time here, unlike every other apt task: the repository was
# added moments ago, so a cache considered fresh is a cache that predates it and
# the package reads as nonexistent. Caught by the VM test, where the repository
# is genuinely new - on a node that already had it, the stale cache still
# contained the package and nothing looked wrong
- name: Install tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Start tailscaled
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started

- name: Report whether this node is already on the tailnet
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  check_mode: false
  failed_when: false

# Joining is the one step that needs a secret, so it runs only when the node is
# not already a member — re-running the play must not require the key
- name: Report whether the node needs to join
  ansible.builtin.set_fact:
    tailscale_join_pending: >-
      {{ tailscale_auth_key | length > 0
         and (tailscale_status.stdout | default('{}') | from_json).BackendState | default('') != 'Running' }}

# Through a file, not an argument: an argument sits in /proc/<pid>/cmdline for
# every process on the node while the join runs, and no_log only hides it
# from Ansible's own output. /run is memory, so nothing lands on disk
- name: Hand the key over in a file only root can read
  ansible.builtin.copy:
    dest: /run/tailscale-authkey
    content: "{{ tailscale_auth_key }}\n"
    owner: root
    group: root
    mode: "0600"
  when: tailscale_join_pending
  no_log: true

- name: Join the tailnet
  ansible.builtin.command:
    argv:
      - tailscale
      - up
      - --auth-key=file:/run/tailscale-authkey
      - --hostname={{ tailscale_hostname }}
      - --accept-routes={{ tailscale_accept_routes | lower }}
      - --ssh={{ tailscale_ssh | lower }}
  when: tailscale_join_pending
  changed_when: true

- name: Forget the key
  ansible.builtin.file:
    path: /run/tailscale-authkey
    state: absent
  when: tailscale_join_pending
