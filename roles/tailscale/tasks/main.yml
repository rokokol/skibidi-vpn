---
- name: Add the Tailscale apt key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"

# deb822_repository parses sources with python3-debian and refuses to run at all
# in check mode without it - and it will not install it in check mode either, so
# a dry run against a host that has never had the package cannot get past this
# task. Installing it as its own step breaks that circle from the first real run
- name: Install what the repository module parses with
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
    # Refresh only if no other role did it in the last hour: five roles each
    # pulling the indexes turns a one-minute play into five minutes of the same
    # download
    cache_valid_time: 3600

- name: Add the Tailscale repository
  ansible.builtin.deb822_repository:
    name: tailscale
    install_python_debian: true
    types: [deb]
    uris: https://pkgs.tailscale.com/stable/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: [main]
    signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
    state: present

- name: Install tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true
    # Refresh only if no other role did it in the last hour: five roles each
    # pulling the indexes turns a one-minute play into five minutes of the same
    # download
    cache_valid_time: 3600

- name: Start tailscaled
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started

- name: Report whether this node is already on the tailnet
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  check_mode: false
  failed_when: false

# Joining is the one step that needs a secret, so it runs only when the node is
# not already a member — re-running the play must not require the key
- name: Join the tailnet
  ansible.builtin.command: >-
    tailscale up
    --authkey {{ tailscale_auth_key }}
    --hostname {{ tailscale_hostname }}
    --accept-routes={{ tailscale_accept_routes | lower }}
    --ssh={{ tailscale_ssh | lower }}
  when:
    - tailscale_auth_key | length > 0
    - (tailscale_status.stdout | default('{}') | from_json).BackendState | default('') != 'Running'
  changed_when: true
  no_log: true
