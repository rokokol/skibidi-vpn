---
# Stopped before the unit file is removed. Removing the file first leaves systemd
# holding a unit it can no longer read, and a running timer that nothing describes
- name: Stop and disable what the previous generation installed
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ cleanup_legacy_units }}"
  failed_when: false

- name: Remove its units
  ansible.builtin.file:
    path: /etc/systemd/system/{{ item }}
    state: absent
  loop: "{{ cleanup_legacy_units }}"
  notify: Reload systemd after cleanup

- name: Remove its scripts and configuration
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ cleanup_legacy_files + cleanup_legacy_directories + cleanup_legacy_sysctl }}"

- name: Apply the unit removal now
  ansible.builtin.meta: flush_handlers

# The point of removing them is that nothing is left running, so that is what
# gets asserted rather than the absence of the files
- name: Ask systemd whether any of them survive
  ansible.builtin.command:
    argv: [systemctl, list-units, --all, --no-legend, "vpn-infra*"]
  register: cleanup_remaining
  changed_when: false
  check_mode: false

- name: Nothing from the previous generation is still loaded
  ansible.builtin.assert:
    that: cleanup_remaining.stdout | trim | length == 0
    fail_msg: "systemd still knows: {{ cleanup_remaining.stdout | trim }}"
  when: not ansible_check_mode
