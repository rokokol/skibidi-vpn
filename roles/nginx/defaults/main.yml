---
# The name this role owns. It has to be the file already serving port 80 on the
# node: a second file also declaring `default_server` makes `nginx -t` fail, and
# the validate step then aborts the play before anything is written
nginx_conf_file: /etc/nginx/conf.d/default.conf
nginx_conf_obsolete_files:
  - /etc/nginx/conf.d/skibidi-vpn.conf

# A live 443 next to a silent 80 is an odd shape for a scanner to find, so 80
# answers the way an ordinary site would
nginx_redirect_target: "https://$host$request_uri"
nginx_probe_echo: false
nginx_probe_echo_path: /skibidi/echo

# Public egress addresses, not tailnet ones: the probe arrives from wherever the
# node it was sent from actually leaves, and a node reaching its own endpoint
# comes back through the hairpin on its public address
nginx_probe_echo_allow: []
