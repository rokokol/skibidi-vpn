---
# The panel's own database, read-only. No API and no token: the CLI can only
# mint a token by rotating the one it owns, which knocks out whoever else held
# it, and the master already holds the file
reporter_panel_db: "{{ xui_db | default('/etc/x-ui/x-ui.db') }}"

# How often the panel's traffic is written for the collector to add to its
# push. The collector pushes every ten minutes and leaves out a file older
# than its window, so this has to stay well inside it. Where the file is lives
# with the collector, as metrics_push_textfile
reporter_traffic_interval: 10min
