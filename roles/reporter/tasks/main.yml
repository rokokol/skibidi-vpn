---
# The weekly letter, its daily snapshot and the charts are gone. A deploy
# removes what an earlier one installed, timers first so that nothing fires
# into a file that is about to go
# A node that never had them has no such unit, and that is the answer wanted
- name: Stop the timers of the letter and its snapshot
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - skibidi-report.timer
    - skibidi-snapshot.timer
  register: reporter_old_timers
  failed_when: reporter_old_timers.failed and 'Could not find' not in (reporter_old_timers.msg | default(''))
  when: not ansible_check_mode

- name: Remove the units of the letter and its snapshot
  ansible.builtin.file:
    path: /etc/systemd/system/{{ item }}
    state: absent
  loop:
    - skibidi-report.timer
    - skibidi-report.service
    - skibidi-snapshot.timer
    - skibidi-snapshot.service
  notify: Reload systemd

- name: Look for the snapshots of the letter
  ansible.builtin.find:
    paths: "{{ metrics_push_textfile | dirname }}"
    patterns: ["snapshot-*.json"]
  register: reporter_old_snapshots

# The charts' cache and font are gone with the charts. The letter's theme file
# is the checker's, which dresses the alert mail in it
- name: Remove what the letter left
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ (reporter_old_snapshots.files | map(attribute='path') | list) + ['/etc/skibidi/ddlc.mplstyle', '/etc/skibidi/chart-font.otf', (metrics_push_textfile | dirname) ~ '/mpl'] }}"

# 0700: the traffic file names every client
- name: Make the directory the traffic file lives in
  ansible.builtin.file:
    path: "{{ metrics_push_textfile | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install the reporter
  ansible.builtin.copy:
    src: skibidi-report.py
    dest: /usr/local/sbin/skibidi-report
    owner: root
    group: root
    mode: "0700"

# Not left to the checker role: on a fresh master this role runs first, and a
# config written into a directory another role owns is a deploy-order landmine
- name: Make the directory the configuration lives in
  ansible.builtin.file:
    path: /etc/skibidi
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the reporter's configuration
  ansible.builtin.template:
    src: report.toml.j2
    dest: /etc/skibidi/report.toml
    owner: root
    group: root
    mode: "0600"

# Only where the node names a station, like the push target they read. A
# master that names none has no dashboard to feed, and a timer that writes a
# file nobody reads would be a job for nothing
- name: Install the units that write the panel's traffic
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - skibidi-traffic.service
    - skibidi-traffic.timer
  notify: Reload systemd
  when: backup_url | default('') | length > 0

- name: Look for a traffic timer an earlier deploy installed
  ansible.builtin.stat:
    path: /etc/systemd/system/skibidi-traffic.timer
  register: reporter_traffic_timer
  when: backup_url | default('') | length == 0

- name: Stop the traffic timer of a master that names no station
  ansible.builtin.systemd_service:
    name: skibidi-traffic.timer
    state: stopped
    enabled: false
  when:
    - backup_url | default('') | length == 0
    - reporter_traffic_timer.stat.exists
    - not ansible_check_mode

- name: Remove the traffic units of a master that names no station
  ansible.builtin.file:
    path: /etc/systemd/system/{{ item }}
    state: absent
  loop:
    - skibidi-traffic.service
    - skibidi-traffic.timer
  notify: Reload systemd
  when: backup_url | default('') | length == 0

- name: Apply the unit changes before enabling the timer
  ansible.builtin.meta: flush_handlers

# Skipped in check mode: the unit it enables is written by this same play, and
# a dry run deliberately does not write it
- name: Enable the traffic timer
  ansible.builtin.systemd_service:
    name: skibidi-traffic.timer
    enabled: true
    state: started
  when:
    - backup_url | default('') | length > 0
    - not ansible_check_mode

# The daily check runs this on the master every morning, and the traffic timer
# runs the other command. A panel release that moves a column fails here, in
# front of someone, and not as a daily mail that never comes
- name: Prove the panel's open items can be listed
  ansible.builtin.command:
    argv: [/usr/local/sbin/skibidi-report, problems]
  changed_when: false
  when: not ansible_check_mode
