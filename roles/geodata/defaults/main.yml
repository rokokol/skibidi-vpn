---
# Where Xray resolves geosite:/geoip: tokens. The panel installs its databases
# here and looks nowhere else
geodata_dir: /usr/local/x-ui/bin
geodata_xray: /usr/local/x-ui/bin/xray-linux-amd64

# The config the running core was built from, and a second one that names every
# database directly. The two cover different halves: the live config proves the
# databases the rules actually reference, the probe proves the rest
geodata_live_config: /usr/local/x-ui/bin/config.json
geodata_probe_config: /etc/skibidi/xray-geodata-probe.json

# One entry per database.
#
# `remote` is the filename the release publishes, which is also the name written
# inside its .sha256sum file. Every upstream here calls its files geoip.dat and
# geosite.dat, and only `local` tells the builds apart, so each download is
# verified in a directory of its own.
#
# `probe_ip` / `probe_domain` name a category the database must carry. Xray
# parses a database only when a rule references it, so one that no rule names
# yet is installed unread: the probe is what makes a truncated download fail
# now instead of on the day somebody writes the first rule against it.
geodata_sources:
  - local: geoip.dat
    remote: geoip.dat
    base: https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download
    probe_ip: ru
  - local: geosite.dat
    remote: geosite.dat
    base: https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download
    probe_domain: category-ru
  - local: geoip_RU.dat
    remote: geoip.dat
    base: https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download
    probe_ip: ru
  - local: geosite_RU.dat
    remote: geosite.dat
    base: https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download
    probe_domain: category-ru
  - local: geoip_IR.dat
    remote: geoip.dat
    base: https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download
    probe_ip: ir
  - local: geosite_IR.dat
    remote: geosite.dat
    base: https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download
    probe_domain: category-ir

# Daily, scattered across two hours: the whole fleet asking one origin for the
# same release on the same minute is a herd, and the data is a day-grain thing
geodata_on_calendar: daily
geodata_randomized_delay: 2h
