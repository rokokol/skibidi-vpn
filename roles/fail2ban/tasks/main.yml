---
# This role runs after `xui` on purpose. The panel's own management script writes
# /etc/fail2ban/filter.d/3x-ipl.conf and action.d/3x-ipl.conf itself, so a role
# that runs before the panel is installed has its work overwritten the moment
# the installer runs - visible only as a second play that keeps finding the same
# work to do. This role goes last and stays, and the difference is deliberate: the
# panel's ban spares SSH and its own port, while this one closes everything by
# default - administration arrives over the tunnel, which is never banned, so
# an exception would only leave a banned client a way in.
- name: Install fail2ban and what its actions call
  ansible.builtin.apt:
    name: [fail2ban, nftables]
    state: present
    update_cache: true
    cache_valid_time: 3600

# The panel writes here, and the jail reads it. Created by this role because the
# jail refuses to start on a logpath that does not exist, and the panel only
# creates it the first time it has something to say
- name: Make the directory the panel logs bans into
  ansible.builtin.file:
    path: "{{ fail2ban_ipl_logpath | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: fail2ban_ipl_enabled

- name: Make sure the log the jail watches exists
  ansible.builtin.copy:
    dest: "{{ item }}"
    content: ""
    force: false
    owner: root
    group: root
    mode: "0644"
  loop:
    - "{{ fail2ban_ipl_logpath }}"
    - "{{ fail2ban_ipl_logpath | dirname }}/3xipl-banned.log"
  when: fail2ban_ipl_enabled

# The panel owns the format of the log this filter reads, and changes it in its
# own releases, so its filter is the one that stays correct. This role leaves it
# alone where it exists and only supplies one where the panel never wrote it -
# a jail whose filter is missing does not load at all
- name: Look for the filter the panel installs
  ansible.builtin.stat:
    path: /etc/fail2ban/filter.d/3x-ipl.conf
  register: fail2ban_panel_filter
  when: fail2ban_ipl_enabled

- name: Supply a filter only if the panel never wrote one
  ansible.builtin.template:
    src: filter-3x-ipl.conf.j2
    dest: /etc/fail2ban/filter.d/3x-ipl.conf
    owner: root
    group: root
    mode: "0644"
  when:
    - fail2ban_ipl_enabled
    - not fail2ban_panel_filter.stat.exists
  notify: Restart fail2ban

- name: Say which filter is in use
  ansible.builtin.debug:
    msg: >-
      {{ 'using the panel-installed 3x-ipl filter, which tracks its log format'
         if fail2ban_panel_filter.stat.exists
         else 'the panel installed no 3x-ipl filter, so this role supplied one' }}
  when: fail2ban_ipl_enabled

# The action is policy, not format: what a ban closes, and for how long, is a
# decision that belongs in the registry and has to survive a panel reinstall.
# The panel's own version spares SSH and its port, which leaves a banned client
# a way in that it does not need - administration arrives over the tunnel, and
# the tunnel is excluded from banning entirely. It is also written with
# nftables rather than the panel's iptables, so every ban lives in one table
- name: Install the action that decides what a ban closes
  ansible.builtin.template:
    src: action-3x-ipl.conf.j2
    dest: /etc/fail2ban/action.d/3x-ipl.conf
    owner: root
    group: root
    mode: "0644"
  when: fail2ban_ipl_enabled
  notify: Restart fail2ban

# The panel writes its own jail file declaring the same jail. Two declarations
# are resolved by filename order, which happens to favour this role's and reads as an
# accident - so the panel's is removed and this role's file is the only place
# the jail is defined. The panel recreates it if its menu is used again, and the
# next play takes it back
- name: Remove the panel's own jail declaration
  ansible.builtin.file:
    path: /etc/fail2ban/jail.d/3x-ipl.conf
    state: absent
  when: fail2ban_ipl_enabled
  notify: Restart fail2ban

# Asked of every node in the inventory, not only those a --limit names,
# because each node's ignoreip needs the whole fleet. The question reads and
# changes nothing, and a node that does not answer is left out with a warning
# rather than stopping the deploy of another
- name: Ask every node of the fleet for its public address
  ansible.builtin.script:
    cmd: skibidi-fail2ban-facts.py public-address
    executable: python3
  delegate_to: "{{ item }}"
  loop: "{{ groups['all'] }}"
  run_once: true
  register: fail2ban_fleet_answers
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  check_mode: false

- name: Keep the addresses the fleet gave
  ansible.builtin.set_fact:
    fail2ban_fleet_addresses: >-
      {{ fail2ban_fleet_answers.results | selectattr('stdout', 'defined')
         | map(attribute='stdout') | map('trim') | select | unique | list }}

- name: Say which nodes gave no public address
  ansible.builtin.debug:
    msg: >-
      no public address from {{ item.item }}, so this deploy does not keep it
      out of the bans; it is either down or behind a NAT this role cannot see past
  loop: "{{ fail2ban_fleet_answers.results | rejectattr('stdout', 'defined') | list
            + fail2ban_fleet_answers.results | selectattr('stdout', 'defined')
              | selectattr('stdout', 'equalto', '') | list }}"
  loop_control:
    label: "{{ item.item }}"
  run_once: true

- name: Declare the jails
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.d/skibidi.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started

- name: Apply pending restarts before asking what is running
  ansible.builtin.meta: flush_handlers

# A jail present in the configuration and a jail fail2ban actually loaded are
# different things: a filter that does not match its log makes fail2ban drop the
# jail with a line in its own log and carry on
- name: Ask fail2ban which jails it loaded
  ansible.builtin.command:
    argv: [fail2ban-client, status]
  register: fail2ban_status
  changed_when: false
  check_mode: false
  retries: 5
  delay: 3
  until: fail2ban_status.rc == 0

- name: Every declared jail is loaded
  ansible.builtin.assert:
    that: item in fail2ban_status.stdout
    fail_msg: >-
      fail2ban did not load the {{ item }} jail; it is configured but not
      running, so nothing is being banned by it
  loop: "{{ ['sshd'] + (['recidive'] if fail2ban_recidive_enabled else [])
            + (['3x-ipl'] if fail2ban_ipl_enabled else []) }}"
  when: not ansible_check_mode

# A week-long recidive ban that only the panel's jail caused holds a client
# who passed the device limit as an attacker. The jails above now run with a
# recidive that skips those bans, so a lifted client is not banned again. An
# address any other jail banned stays banned
- name: Find the clients recidive holds for the device limit alone
  ansible.builtin.script:
    cmd: skibidi-fail2ban-facts.py client-only-bans 3x-ipl
    executable: python3
  register: fail2ban_client_bans
  changed_when: false
  when:
    - fail2ban_recidive_enabled
    - fail2ban_ipl_enabled
    - not ansible_check_mode

- name: Lift those bans
  ansible.builtin.command:
    argv: [fail2ban-client, set, recidive, unbanip, "{{ item }}"]
  loop: "{{ fail2ban_client_bans.stdout_lines | default([]) }}"
  changed_when: true
  when:
    - fail2ban_recidive_enabled
    - fail2ban_ipl_enabled
    - not ansible_check_mode

# A loaded jail is not a jail reading its log. With a journal backend fail2ban
# drops the jail's logpath silently and the jail watches the journal instead,
# where the panel and fail2ban itself never write - the jail is green, its
# counters stay at zero, and nobody is banned. Asking fail2ban which file each
# jail actually opened is the only question that tells the two apart
- name: Ask fail2ban which file each file-reading jail opened
  ansible.builtin.command:
    argv: [fail2ban-client, get, "{{ item.jail }}", logpath]
  loop: "{{ ([{'jail': 'recidive', 'path': '/var/log/fail2ban.log'}] if fail2ban_recidive_enabled else [])
            + ([{'jail': '3x-ipl', 'path': fail2ban_ipl_logpath}] if fail2ban_ipl_enabled else []) }}"
  loop_control:
    label: "{{ item.jail }}"
  register: fail2ban_logpaths
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Every file-reading jail reads its file, not the journal
  ansible.builtin.assert:
    that: item.item.path in item.stdout
    fail_msg: >-
      the {{ item.item.jail }} jail did not open {{ item.item.path }} (fail2ban
      says: {{ item.stdout | trim }}); it inherited the journal backend and is
      banning nobody
  loop: "{{ fail2ban_logpaths.results }}"
  loop_control:
    label: "{{ item.item.jail }}"
  when: not ansible_check_mode

# A jail whose action failed to start still reports itself loaded; the set
# the action creates in the kernel is what a ban would be written into, so
# its existence is the proof the action ran
- name: Ask the kernel for the set the panel's bans go into
  ansible.builtin.command:
    argv: [nft, list, set, inet, f2b-table, addr-set-3x-ipl]
  register: fail2ban_ipl_set
  changed_when: false
  failed_when: false
  check_mode: false
  when: fail2ban_ipl_enabled

- name: The panel's ban set exists in the kernel
  ansible.builtin.assert:
    that: fail2ban_ipl_set.rc == 0
    fail_msg: >-
      nftables has no set addr-set-3x-ipl in f2b-table; the 3x-ipl action did
      not start and its bans have nowhere to land ({{ fail2ban_ipl_set.stderr | trim }})
  when:
    - fail2ban_ipl_enabled
    - not ansible_check_mode
