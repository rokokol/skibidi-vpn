---
# Every ban on the node is written with nftables, the panel's address-limit
# one included: its action here is built on fail2ban's own nftables action
# rather than the iptables one the panel ships, so `nft list ruleset` shows
# all of them in one table
fail2ban_banaction: nftables
fail2ban_backend: systemd

# Addresses a ban must never touch. The tunnel ranges come from the metrics
# role's declaration rather than being spelled again here: two declarations of
# "the tunnel" is how one of them ends up missing the IPv6 half
fail2ban_ignoreip: "{{ ['127.0.0.1/8', '::1'] + metrics_tunnel_ranges }}"

# SSH is the one door that is open to the whole internet on purpose: moving it
# to a high port reads as hiding and works against the legend the node relies on
fail2ban_sshd_maxretry: 5
fail2ban_sshd_findtime: 10m
fail2ban_sshd_bantime: 1h

# An address that comes back after each ban is not a passer-by. The recidive
# jail reads fail2ban's own log and bans the repeat offenders for much longer
fail2ban_recidive_enabled: true
fail2ban_recidive_findtime: 1d
fail2ban_recidive_bantime: 1w
fail2ban_recidive_maxretry: 3

# The panel writes this log when a client connects from more addresses than it
# is allowed. The jail acts on the panel's own finding rather than re-deriving it
fail2ban_ipl_enabled: true
fail2ban_ipl_logpath: /var/log/x-ui/3xipl.log
fail2ban_ipl_findtime: 32
fail2ban_ipl_bantime: 30m

# Ports a ban must leave open, comma-separated. Empty on purpose: a ban that
# spares SSH leaves the banned address a way in, and there is nothing to spare
# it for - administration arrives over the tunnel, which `ignoreip` already
# excludes from banning, and the panel answers on the tunnel address only. Set
# this only on a node with no tunnel, where the public SSH port is the sole way
# back in
fail2ban_ipl_exempt_ports: ""
