---
- name: Install what acme.sh needs
  ansible.builtin.apt:
    name: [curl, socat, cron]
    state: present
    update_cache: true
    # Refresh only if no other role did it in the last hour: five roles each
    # pulling the indexes turns a one-minute play into five minutes of the same
    # download
    cache_valid_time: 3600

- name: Install acme.sh
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      curl -fsSL https://get.acme.sh | sh -s email={{ certs_email }}
    executable: /bin/bash
    creates: "{{ certs_home }}/acme.sh"

# Scoped to one zone and, where the provider allows it, to this node's address.
# A token that can edit every zone is the same blast radius as the registrar
# Skipped when no token is supplied, rather than writing an empty one. The file
# may already hold a working token placed by hand or by an earlier run, and
# overwriting it with nothing breaks renewal silently - the certificate keeps
# working until the day it expires
- name: Store the DNS API token
  ansible.builtin.copy:
    dest: /etc/acme-cf-token
    content: "{{ certs_cf_token }}\n"
    owner: root
    group: root
    mode: "0600"
  when: certs_cf_token | length > 0
  no_log: true

- name: Look for a certificate already installed
  ansible.builtin.stat:
    path: "{{ certs_install_dir }}/{{ certs_fullchain_name }}"
  register: certs_installed

- name: Create the install directory
  ansible.builtin.file:
    path: "{{ certs_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# DNS-01 rather than HTTP-01 on purpose: it issues a wildcard, so only the
# wildcard reaches Certificate Transparency and the individual hostnames this
# fleet uses stay out of a public log
- name: Issue the wildcard certificate
  ansible.builtin.command:
    cmd: >-
      {{ certs_home }}/acme.sh --issue --dns dns_cf
      -d '{{ certs_primary_domain }}' -d {{ certs_domain }}
      --server letsencrypt
    creates: "{{ certs_home }}/{{ certs_primary_domain }}_ecc/fullchain.cer"
  environment:
    CF_Token: "{{ certs_cf_token }}"
  no_log: true

# The reload command runs from acme.sh's own cron on renewal. Every service
# holding the certificate has to be told: nginx rereads on reload, the panel
# reads only at startup, so leaving it out means it serves the expired
# certificate until something else restarts it. systemd-run detaches the
# restart, because the panel may be carrying the session issuing it
# `creates` on the certificate would make this a one-time task, so a change to
# the reload command would never reach the renewal that has to run it. The
# recorded command is read instead, and the install is redone only when it
# differs or the certificate is not there at all
- name: Read the reload command acme.sh has recorded
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      grep -h '^Le_ReloadCmd='
      '{{ certs_home }}/{{ certs_primary_domain }}_ecc/{{ certs_primary_domain }}.conf'
      2>/dev/null | head -1 | cut -d= -f2- | tr -d "'\"" | base64 -d 2>/dev/null || true
    executable: /bin/bash
  register: certs_recorded_reload
  changed_when: false
  check_mode: false
  failed_when: false

- name: Install the certificate where the services read it
  ansible.builtin.command:
    cmd: >-
      {{ certs_home }}/acme.sh --install-cert -d '{{ certs_primary_domain }}' --ecc
      --key-file {{ certs_install_dir }}/{{ certs_key_name }}
      --fullchain-file {{ certs_install_dir }}/{{ certs_fullchain_name }}
      --reloadcmd "{{ certs_reload_cmd }}"
  when: >-
    not certs_installed.stat.exists
    or (certs_recorded_reload.stdout | default('') | trim) != (certs_reload_cmd | trim)
  changed_when: true

# acme.sh installs its own cron entry; this asserts it rather than adding a
# second renewal path that would race the first
- name: Prove renewal is scheduled
  ansible.builtin.command: crontab -l
  register: certs_cron
  changed_when: false
  check_mode: false

- name: Fail if nothing will renew the certificate
  ansible.builtin.assert:
    that: "'acme.sh' in certs_cron.stdout"
    fail_msg: acme.sh installed no renewal cron entry; the certificate would expire silently

# A renewal that runs but never reaches the panel looks exactly like a renewal
# that works, until a client refuses the connection. -checkend asks the question
# directly rather than parsing a date: openssl prints the expiry in a format
# whose timezone name Python's strptime no longer accepts, and a check that
# depends on string parsing fails for reasons unrelated to certificates
- name: Fail while there is still time to renew the certificate
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -checkend
      - "{{ certs_min_days_left | int * 86400 }}"
      - -noout
      - -in
      - "{{ certs_install_dir }}/{{ certs_fullchain_name }}"
  register: certs_validity
  changed_when: false
  check_mode: false
  failed_when: certs_validity.rc != 0
