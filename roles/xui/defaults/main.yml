---
# A node and its master must run the same panel and core version for node mode
# to work, so this is pinned and moved deliberately, never tracked to latest
xui_version: "3.7.0"

# The installer script is fetched at a commit, not a branch, and checked
# against a digest before bash sees it: the tarball it fetches is pinned by
# the version above, but the script itself comes from `main` otherwise, and a
# changed script is root on every node at the next deploy. Both move together
# with xui_version - the commit is the one the release tag points at
xui_installer_commit: f727d04f6522bb94a8fb52e8352fdcafb51c11e1
xui_installer_sha256: a7f4fedcea3abe8987508d00f29834b8872e4e4e5059159eb19460d474b37cdc
# The management script the installer puts at /usr/bin/x-ui, pinned back by the role.
# WORKAROUNDS.md says why, under "The panel installer is run, not replaced"
xui_script_sha256: cfabcd4af35a3646c374ea0ccba5178f4c0d3135f699277fc8d8b810158e85c0
# The panel binary the release tarball carries for amd64, pinned instead of the tarball.
# WORKAROUNDS.md has why and what it catches, under "The panel binary is pinned on the
# way out"
xui_binary_sha256: 4738190332c5480ec96fd72e10a21157ee4bcf91c240a9b4b061d14f15092298

xui_db: /etc/x-ui/x-ui.db

# The panel answers on the tunnel address only; set per node from its own file
xui_listen_ip: "127.0.0.1"
xui_panel_port: 2053

# The panel serves its API and UI under this path. A wrong one answers 200 with
# an empty body, which reads as success to anything checking only a status field
xui_base_path: "/"
