---
# A node and its master must run the same panel and core version for node mode
# to work, so this is pinned and moved deliberately, never tracked to latest
xui_version: "3.8.5"

# The installer script is fetched at a commit, not a branch, and checked
# against a digest before bash sees it: the tarball it fetches is pinned by
# the version above, but the script itself comes from `main` otherwise, and a
# changed script is root on every node at the next deploy. Both move together
# with xui_version - the commit is the one the release tag points at
xui_installer_commit: 7ef22f94c950ff09f0870e2295fa65ad5968742c
xui_installer_sha256: 4e3fe7fe00ef8e904ce6a0e9c36fd8a0c7179fe5e786f23e31801aee84c6347d
# The panel binary the release tarball carries for amd64. DEVIATIONS.md has why and
# what it catches, under "The panel binary is pinned on the way out"
xui_binary_sha256: 816420f7a6df3eb3272c3608767207b1ade81c3dcb7fed7b46c7949454a8a14c

# The Xray core held below the one the panel release bundles. WORKAROUNDS.md has why and
# when it can go, under "Xray is held at 26.7.11". The archive digest is the SHA2-256 the
# release publishes in its .dgst file; the binary digest is the xray inside it
xui_xray_version: "26.7.11"
xui_xray_zip_sha256: aa11c3685c71da0ffc71e511db50404609e7e963bb914b048f59a6a00af8930e
xui_xray_sha256: 5200ed9b358cf380b2d9f1fe28c7e56220c0159adcd86a64592246d8257a043c
xui_xray_path: /usr/local/x-ui/bin/xray-linux-amd64

xui_db: /etc/x-ui/x-ui.db

# The panel answers on the tunnel address only; set per node from its own file
xui_listen_ip: "127.0.0.1"
xui_panel_port: 2053

# The panel serves its API and UI under this path. A wrong one answers 200 with
# an empty body, which reads as success to anything checking only a status field
xui_base_path: "/"
