---
- name: Install the packages the panel and our checks need
  ansible.builtin.apt:
    name: [curl, sqlite3, tar]
    state: present
    update_cache: true
    # Refresh only if no other role did it in the last hour: five roles each
    # pulling the indexes turns a one-minute play into five minutes of the same
    # download
    cache_valid_time: 3600

# `x-ui version` is not a subcommand: it prints the help menu and exits 0, so a
# check against its output always looks like a mismatch and reinstalls the panel
# on every run. The binary itself answers -v with the bare version
- name: Report the installed panel version
  ansible.builtin.command:
    argv: [/usr/local/x-ui/x-ui, -v]
  register: xui_installed
  changed_when: false
  check_mode: false
  failed_when: false

# Pinned rather than latest: a node and its master must run the same version for
# node mode to work at all, so "whatever is newest today" desynchronises the pair
- name: Install 3x-ui
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      curl -fsSL https://raw.githubusercontent.com/MHSanaei/3x-ui/master/install.sh
      | bash -s {{ xui_version }}
    executable: /bin/bash
  when: (xui_installed.stdout | default('') | trim) != xui_version
  changed_when: true

# Read before write. The settings command below cannot report whether it changed
# anything, so asking the database first is what separates "nothing to do" from
# "about to rebind the panel" - and only the second deserves a backup or a restart
- name: Read the settings this role owns
  ansible.builtin.command:
    argv:
      - sqlite3
      - "{{ xui_db }}"
      - >-
        select coalesce(max(case when key='webPort' then value end), '') || '|' ||
               coalesce(max(case when key='webBasePath' then value end), '') || '|' ||
               coalesce(max(case when key='webListen' then value end), '')
        from settings
  register: xui_current
  changed_when: false
  check_mode: false

- name: Note what the panel is bound to now
  ansible.builtin.set_fact:
    xui_binding_matches: >-
      {{ (xui_current.stdout | trim).split('|') == [
           xui_panel_port | string,
           xui_base_path,
           xui_listen_ip,
         ] }}

# One copy per actual change, kept beside the database so a rollback needs
# nothing but the node. Taking one on every run instead fills /etc/x-ui with
# copies of a file that never changed, each holding every client credential
- name: Back up the database before changing its settings
  ansible.builtin.command:
    cmd: >-
      sqlite3 {{ xui_db }} ".backup '{{ xui_db }}.bak-{{ ansible_date_time.iso8601_basic_short }}'"
    creates: "{{ xui_db }}.bak-{{ ansible_date_time.iso8601_basic_short }}"
  when: not xui_binding_matches

# The panel must answer on the tunnel address only. Binding it to 0.0.0.0 and
# relying on the firewall alone means one ufw mistake exposes the whole fleet:
# the panel holds every client secret and the Reality private keys
- name: Bind the panel to the tunnel address and its own base path
  ansible.builtin.command:
    cmd: >-
      x-ui setting
      -port {{ xui_panel_port }}
      -webBasePath {{ xui_base_path }}
      -listenIP {{ xui_listen_ip }}
  when: not xui_binding_matches
  changed_when: true
  notify: Restart x-ui

- name: Enable and start the panel
  ansible.builtin.systemd_service:
    name: x-ui
    enabled: true
    state: started

- name: Apply the restart before asserting where the panel listens
  ansible.builtin.meta: flush_handlers

- name: Prove the panel listens where it was told and nowhere else
  ansible.builtin.shell:
    cmd: set -o pipefail && ss -ltnH "sport = :{{ xui_panel_port }}" | awk '{print $4}'
    executable: /bin/bash
  register: xui_listeners
  changed_when: false
  check_mode: false

- name: Fail if the panel is reachable from outside the tunnel
  ansible.builtin.assert:
    that: xui_listeners.stdout_lines | reject('search', xui_listen_ip) | list | length == 0
    fail_msg: >-
      panel listens on {{ xui_listeners.stdout_lines | join(', ') }}, expected only
      {{ xui_listen_ip }} — a panel on a public address exposes every client secret
