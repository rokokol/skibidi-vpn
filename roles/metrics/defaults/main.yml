---
# Sampling cadence. Ten minutes keeps a week at roughly a thousand rows per
# metric, which SQLite reads back in milliseconds and the report aggregates
# without any precomputed buckets
metrics_boot_delay: 5min
metrics_interval: 10min
metrics_retention_days: 90

metrics_db_dir: /var/lib/skibidi-metrics

# Collection stays root, because some probes need it. Reading the finished
# store is a file permission, not a privilege: the API runs as a dynamic user
# whose only access is membership of this group
metrics_reader_group: skibidi-metrics

# The dynamic user the API runs as. It must not be the name of a static
# account, or systemd uses that account instead of allocating a dynamic one
metrics_api_user: skibidi-metrics-api

# The read-only HTTP API, docs/metrics-api.md. Plain HTTP, because WireGuard
# under the tailnet already encrypts and authenticates below it. The port
# matches the mail host's statistics API, so one dashboard asks both alike
metrics_api_port: 9099

# The socket is bound to this interface and starts whenever it appears. The
# name must stay plain letters, digits and underscores, because the device unit
# the socket hangs on is named after it
metrics_api_interface: "{{ firewall_tunnel_interface }}"

# One process per connection, so this is also the most processes a burst of
# requests can start at once
metrics_api_max_connections: 8

# The tunnel, stated as ranges. Used for the same reason everywhere: the API's
# socket admits sources inside them alone, and the checker requires the
# letter's destinations to be inside them, because a public metrics path would
# cross the internet unencrypted. A fleet on a different tunnel has different
# ranges — override, never edit
metrics_tunnel_ranges:
  - 100.64.0.0/10
  - fd7a:115c:a1e0::/48

# Timers whose last-fired time the report shows; a quiet one is a mechanism
# that stopped without saying so, and the checker alerts on it long before
# Monday — the report only makes the pattern visible over the week
metrics_watched_timers:
  - skibidi-check.timer
  - xray-geodata-update.timer
  - skibidi-metrics.timer

# Units whose restart counters the report turns into weekly deltas. A service
# that restarted forty times without ever being down at check time is invisible
# to the checker and exactly what this row exists to catch
metrics_watched_units: [x-ui, nginx, fail2ban, tailscaled]
