---
# Sampling cadence. Ten minutes keeps a week at roughly a thousand rows per
# metric, which SQLite reads back in milliseconds and the API aggregates
# without any precomputed buckets
metrics_boot_delay: 5min
metrics_interval: 10min
metrics_retention_days: 90

metrics_db_dir: /var/lib/skibidi-metrics

# The code the collector, the reporter and the daily check share: the push and
# the rules that decide what is a problem. docs/metrics-api.md, "The push"
metrics_lib_dir: /usr/local/lib/skibidi

# The Pushgateway's port on the backup station. DEVIATIONS.md, "The push to the
# station borrows the backup's account, host and rule", says why nothing else
# is set here
metrics_push_port: 9091

# The file the master's reporter writes its traffic to and the collector adds
# to its own push. The collector is the one writer of this host's push group,
# so a series that went away goes away from the station: PUT replaces the
# group, and a second writer would be wiped by it or leave stale series behind
metrics_push_textfile: /var/lib/skibidi-report/traffic.prom

# How often the newest samples, the master's traffic and the attackers reach
# the station, apart from the sampling above. A push reads the store and adds
# no row to it, so a short interval costs the store nothing
metrics_push_interval: 1min

# fail2ban's own log. The push names the busiest addresses of the day and the
# latest bans, in every jail and under its name
metrics_fail2ban_log: /var/log/fail2ban.log

# Where the push target is written for the units that push. It holds no
# secret: the password stays in the backup role's root-only file
metrics_push_env_file: /etc/skibidi/push.env

# Collection stays root, because some probes need it. Reading the finished
# store is a file permission, not a privilege: the API runs as a dynamic user
# whose only access is membership of this group
metrics_reader_group: skibidi-metrics

# The dynamic user the API runs as. It must not be the name of a static
# account, or systemd uses that account instead of allocating a dynamic one
metrics_api_user: skibidi-metrics-api

# The read-only HTTP API, docs/metrics-api.md. Plain HTTP, because WireGuard
# under the tailnet already encrypts and authenticates below it. The port
# matches the mail host's statistics API, so one dashboard asks both alike
metrics_api_port: 9099

# The socket is bound to this interface and starts whenever it appears. The
# name must stay plain letters, digits and underscores, because the device unit
# the socket hangs on is named after it
metrics_api_interface: "{{ firewall_tunnel_interface }}"

# One process per connection, so this is also the most processes a burst of
# requests can start at once
metrics_api_max_connections: 8

# The tunnel, stated as ranges. Used for the same reason everywhere: the API's
# socket admits sources inside them alone, and the checker requires the
# node's declared API address to be inside them, because a public metrics path
# would cross the internet unencrypted. A fleet on a different tunnel has different
# ranges — override, never edit
metrics_tunnel_ranges:
  - 100.64.0.0/10
  - fd7a:115c:a1e0::/48

# Timers whose last-fired time is sampled; a quiet one is a mechanism that
# stopped without saying so, and the checker alerts on it within hours — the
# dashboard only makes the pattern visible over the week
metrics_watched_timers:
  - skibidi-check.timer
  - xray-geodata-update.timer
  - skibidi-metrics.timer
  - skibidi-push.timer

# Units whose restart counters are sampled and pushed. A service
# that restarted forty times without ever being down at check time is invisible
# to the checker and exactly what this row exists to catch
metrics_watched_units: [x-ui, nginx, fail2ban, tailscaled]
