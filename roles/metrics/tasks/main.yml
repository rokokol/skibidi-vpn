---
- name: Install the collector and the API
  ansible.builtin.copy:
    src: skibidi-metrics.py
    dest: /usr/local/sbin/skibidi-metrics
    owner: root
    group: root
    mode: "0755"

- name: Remove the SSH export the API replaced
  ansible.builtin.import_tasks: legacy-ssh-export.yml

# Collection needs root; reading the finished store does not. The API runs as
# a dynamic user whose only privilege is this group, so a bug in it reaches one
# file, read-only
- name: Create the group that may read the store
  ansible.builtin.group:
    name: "{{ metrics_reader_group }}"
    system: true

- name: Install the units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - skibidi-metrics.service
    - skibidi-metrics.timer
    - skibidi-metrics-api.socket
    - skibidi-metrics-api@.service
  register: metrics_units
  notify: Reload systemd

- name: Apply the unit changes before enabling anything
  ansible.builtin.meta: flush_handlers

# Skipped in check mode: the unit it enables is written by this same play,
# and a dry run deliberately does not write it
- name: Enable the timer
  ansible.builtin.systemd_service:
    name: skibidi-metrics.timer
    enabled: true
    state: started
  when: not ansible_check_mode

# A node is never deployed into a state where its own sampler cannot run; the
# first rows land now, in front of someone, rather than failing silently on a
# timer tonight
- name: Take the first sample, now
  ansible.builtin.command:
    argv: [/usr/local/sbin/skibidi-metrics, collect]
  changed_when: false
  when: not ansible_check_mode

# Group read is the entire privilege the API holds. setgid keeps whatever
# sqlite creates beside the store inside the group, so a later journal file
# cannot end up unreadable to the API
- name: Let the reader group read what root collects
  ansible.builtin.file:
    path: "{{ metrics_db_dir }}"
    state: directory
    owner: root
    group: "{{ metrics_reader_group }}"
    mode: "2750"

- name: Keep the store itself root-written and group-read
  ansible.builtin.file:
    path: "{{ metrics_db_dir }}/metrics.db"
    owner: root
    group: "{{ metrics_reader_group }}"
    mode: "0640"
  when: not ansible_check_mode

# A running socket keeps the address and options it was started with, so a
# changed unit restarts it; a request in flight belongs to its own process
# and survives that
- name: Listen for API requests
  ansible.builtin.systemd_service:
    name: skibidi-metrics-api.socket
    enabled: true
    state: "{{ 'restarted' if metrics_units.changed else 'started' }}"
  when: not ansible_check_mode

# Asked the way the master will ask: through the socket, the sandbox and the
# dynamic user, at the address the letter reads. A sandbox that cannot reach
# the store, or a socket bound somewhere else, fails here instead of on Monday
- name: Prove the API answers at the address the letter reads
  ansible.builtin.uri:
    url: >-
      http://{{ '[' ~ metrics_host ~ ']' if ':' in metrics_host else metrics_host }}:{{ metrics_api_port }}/v1/samples
    return_content: true
  register: metrics_api_answer
  retries: 5
  delay: 2
  until: metrics_api_answer.status == 200
  failed_when: metrics_api_answer.status != 200 or metrics_api_answer.json.rows | length == 0
  when: not ansible_check_mode

# The inverse proof, because a check that cannot go red is not evidence: an
# account with nothing but the reader group must not be able to write the store.
# setpriv rather than become_user or sudo: an unprivileged become needs the acl
# package just to hand over Ansible's temp files, and util-linux is everywhere
- name: Prove the reader group cannot write the store
  ansible.builtin.command:
    argv:
      - setpriv
      - --reuid=nobody
      - --regid=nogroup
      - --groups={{ metrics_reader_group }}
      - --
      - /usr/local/sbin/skibidi-metrics
      - collect
  register: metrics_write_probe
  changed_when: false
  failed_when: metrics_write_probe.rc == 0
  when: not ansible_check_mode
