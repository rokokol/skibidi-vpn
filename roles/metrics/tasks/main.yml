---
- name: Install the collector
  ansible.builtin.copy:
    src: skibidi-metrics.py
    dest: /usr/local/sbin/skibidi-metrics
    owner: root
    group: root
    mode: "0755"

# Collection needs root; reading the finished store does not. The export runs
# as this account so that a bypassed guard is an account that can read one
# file, not a root shell
- name: Create the export group
  ansible.builtin.group:
    name: "{{ metrics_export_user }}"
    system: true

# /bin/sh, not nologin: sshd runs a forced command through the account's login
# shell, so nologin silently kills the export itself — the fleet answered
# "This account is currently not available" instead of metrics. Login stays
# impossible anyway: the password is locked and the only key is chained to the
# guard by restrict,command=
- name: Create the export account
  ansible.builtin.user:
    name: "{{ metrics_export_user }}"
    group: "{{ metrics_export_user }}"
    system: true
    shell: /bin/sh
    home: "{{ metrics_db_dir }}"
    create_home: false
    password_lock: true

- name: Install the units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - skibidi-metrics.service
    - skibidi-metrics.timer
  notify: Reload systemd

- name: Apply the unit changes before enabling the timer
  ansible.builtin.meta: flush_handlers

# Skipped in check mode: the unit it enables is written by this same play,
# and a dry run deliberately does not write it
- name: Enable the timer
  ansible.builtin.systemd_service:
    name: skibidi-metrics.timer
    enabled: true
    state: started
  when: not ansible_check_mode

# A node is never deployed into a state where its own sampler cannot run; the
# first rows land now, in front of someone, rather than failing silently on a
# timer tonight
- name: Take the first sample, now
  ansible.builtin.command:
    argv: [/usr/local/sbin/skibidi-metrics, collect]
  changed_when: false
  when: not ansible_check_mode

# Group read is the entire privilege the export account holds. setgid keeps
# whatever sqlite creates beside the store inside the group, so a later journal
# file cannot end up unreadable to the export
- name: Let the export group read what root collects
  ansible.builtin.file:
    path: "{{ metrics_db_dir }}"
    state: directory
    owner: root
    group: "{{ metrics_export_user }}"
    mode: "2750"

- name: Keep the store itself root-written and group-read
  ansible.builtin.file:
    path: "{{ metrics_db_dir }}/metrics.db"
    owner: root
    group: "{{ metrics_export_user }}"
    mode: "0640"
  when: not ansible_check_mode

# Run as the account the master will arrive as, not as root: a read-only open
# that needs write access anyway is exactly the kind of thing that works in
# development and fails on the node. runuser rather than become_user or sudo:
# an unprivileged become needs the acl package just to hand over Ansible's
# temp files, sudo is absent from minimal images, and util-linux is everywhere
- name: Prove the store answers the export account with what was just written
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - "{{ metrics_export_user }}"
      - --
      - /usr/local/sbin/skibidi-metrics
      - export
      - --since
      - "0"
      - --until
      - "9999999999999999"
  become: true
  register: metrics_export
  changed_when: false
  failed_when: metrics_export.rc != 0 or (metrics_export.stdout | from_json).samples | length == 0
  when: not ansible_check_mode

# The inverse proof, because a check that cannot go red is not evidence: if
# this account ever gains the ability to write the store, the deploy stops
- name: Prove the export account cannot write the store
  ansible.builtin.command:
    argv: [runuser, -u, "{{ metrics_export_user }}", --, /usr/local/sbin/skibidi-metrics, collect]
  become: true
  register: metrics_write_probe
  changed_when: false
  failed_when: metrics_write_probe.rc == 0
  when: not ansible_check_mode

# The master reads the fleet's stores at report time over a key that this guard
# reduces to a single question. Generated on the master and never leaving it;
# the nodes get only the public half
- name: Give the master a key that can only ask for metrics
  ansible.builtin.command:
    argv: [ssh-keygen, -t, ed25519, -N, "", -C, skibidi-report, -f, /root/.ssh/skibidi-report]
  args:
    creates: /root/.ssh/skibidi-report
  when: "'master' in group_names"

# An unattended key cannot have a passphrase, so its file mode is the whole
# protection; asserted rather than assumed, because ssh-keygen's 0600 survives
# only until someone copies the file around
- name: Keep the private half readable by root alone
  ansible.builtin.file:
    path: /root/.ssh/skibidi-report
    owner: root
    group: root
    mode: "0600"
  when: "'master' in group_names and not ansible_check_mode"

- name: Read the public half back
  ansible.builtin.slurp:
    src: /root/.ssh/skibidi-report.pub
  register: metrics_master_pubkey
  when: "'master' in group_names and not ansible_check_mode"

# restrict + a forced command make the key useless for anything but the export,
# from= makes it useless off the tunnel, and the account it opens cannot log
# in, cannot write the store and could not escalate even without the guard
- name: Let the master pull this node's metrics and nothing else
  ansible.posix.authorized_key:
    user: "{{ metrics_export_user }}"
    key: "{{ (hostvars[groups['master'] | first].metrics_master_pubkey.content | b64decode).strip() }}"
    key_options: from="{{ metrics_tunnel_ranges | join(',') }}",restrict,command="/usr/local/sbin/skibidi-metrics ssh-guard"
    comment: skibidi-report
  when:
    - not ansible_check_mode
    - groups['master'] | default([]) | length > 0
    - "'master' not in group_names"
    - hostvars[groups['master'] | first].metrics_master_pubkey is defined
