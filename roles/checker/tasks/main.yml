---
- name: Install what the checks and the mail path need
  ansible.builtin.apt:
    name: [curl, sqlite3, msmtp, msmtp-mta, iproute2, openssl, ca-certificates]
    state: present
    update_cache: true
    cache_valid_time: 3600

# The intake authorises by source address and holds the list of who may use it,
# so this node carries no credential - and therefore nothing here is secret.
# It sits on a public address, so the session is encrypted and the server is
# verified against the system trust store: the weekly letter names every
# client and every node, and a source-address allowlist does not stop a
# reader on the path. STARTTLS rather than implicit TLS is what the intake
# offers (Postfix "may")
- name: Point the mailer at the intake
  ansible.builtin.copy:
    dest: /etc/msmtprc
    content: |
      # Managed by skibidi-vpn.
      # No authentication: the intake decides which nodes may use it by source
      # address, which is why this node holds no mail credential at all.
      defaults
      logfile /var/log/msmtp.log
      account intake
      host {{ checker_smtp | regex_replace(':.*$', '') }}
      port {{ checker_smtp | regex_replace('^.*:', '') }}
      auth off
      {% if checker_smtp_tls %}
      tls on
      tls_starttls on
      tls_trust_file /etc/ssl/certs/ca-certificates.crt
      {% else %}
      # No TLS: the intake is on the tunnel, encrypted and authenticated
      # below SMTP, and the checker refuses this line for any other address
      tls off
      {% endif %}
      from skibidi-vpn@{{ inventory_hostname }}
      account default : intake
    owner: root
    group: root
    mode: "0644"
  when: checker_smtp | length > 0

- name: Make the directory the alert address lives in
  ansible.builtin.file:
    path: /etc/skibidi
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Record where a failure should be reported
  ansible.builtin.copy:
    dest: /etc/skibidi/alert-to
    content: "{{ checker_alert_to }}\n"
    owner: root
    group: root
    mode: "0644"
  when: checker_alert_to | length > 0

# Proven at deploy time rather than discovered on the night something breaks.
# The mail host declares which nodes may use the intake; this only asks whether
# it answers this one
- name: Prove the alert intake answers this node
  ansible.builtin.wait_for:
    host: "{{ checker_smtp | regex_replace(':.*$', '') }}"
    port: "{{ checker_smtp | regex_replace('^.*:', '') | int }}"
    timeout: 15
  when: checker_smtp | length > 0
  check_mode: false

# An open port is not an accepted letter: the intake can answer the handshake
# and refuse this node at RCPT, or refuse the certificate this side now
# insists on, and either shows up only in msmtp's log on the night an alert
# was needed. msmtp exits non-zero when the server refuses, so one letter at
# deploy time is the whole proof, and it reaches the same address a real
# alert would
- name: Prove the intake accepts a letter from this node
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      printf 'To: %s\nFrom: skibidi-vpn@%s\nSubject: [%s] deploy probe\nAuto-Submitted: auto-generated\n\nThe intake accepted a letter from %s at %s. Nothing is wrong.\n' \
        "{{ checker_alert_to }}" "{{ inventory_hostname }}" "{{ inventory_hostname }}" "{{ inventory_hostname }}" "$(date -Is)" \
        | sendmail -t
    executable: /bin/bash
  when:
    - checker_smtp | length > 0
    - checker_alert_to | length > 0
    - not ansible_check_mode
  changed_when: false
  register: checker_probe_letter
  failed_when: checker_probe_letter.rc != 0

# The alert's HTML half. Optional twice over: the css only arrives from a
# deploy run inside the dev shell, and the alert script falls back to plain
# text if the renderer fails - so neither file can cost an alert
- name: Install the alert renderer
  ansible.builtin.copy:
    src: skibidi-alert-html.py
    dest: /usr/local/sbin/skibidi-alert-html
    owner: root
    group: root
    mode: "0700"

- name: Carry the theme the alerts colour themselves with
  ansible.builtin.copy:
    src: "{{ lookup('env', 'SKIBIDI_REPORT_CSS') }}"
    dest: /etc/skibidi/ddlc-report.css
    owner: root
    group: root
    mode: "0644"
  when: lookup('env', 'SKIBIDI_REPORT_CSS') | length > 0

- name: Install the check and the alert
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0700"
  loop:
    - { src: skibidi-check.j2, dest: /usr/local/sbin/skibidi-check }
    - { src: skibidi-alert.j2, dest: /usr/local/sbin/skibidi-alert }

- name: Install the units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - skibidi-check.service
    - skibidi-check.timer
    - skibidi-alert@.service
  notify: Reload systemd

- name: Apply the unit changes before enabling the timer
  ansible.builtin.meta: flush_handlers

# Skipped in check mode: the unit file it enables is written by this same play,
# and a dry run deliberately does not write it, so systemd is asked about a
# timer that does not exist yet
- name: Enable the timer
  ansible.builtin.systemd_service:
    name: skibidi-check.timer
    enabled: true
    state: started
  when: not ansible_check_mode

# Running it once here means a node is never deployed into a state its own
# checks reject - and the first alert arrives now, in front of someone, rather
# than at three in the morning
- name: Run the checks once, now
  ansible.builtin.command:
    argv: [/usr/local/sbin/skibidi-check]
  register: checker_first_run
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Report what the node says about itself
  ansible.builtin.debug:
    msg: "{{ checker_first_run.stdout_lines }}"
  when: not ansible_check_mode

- name: Fail the deploy if the node does not pass its own checks
  ansible.builtin.assert:
    that: checker_first_run.rc == 0
    fail_msg: >-
      {{ checker_first_run.stdout_lines | select('match', '^FAIL') | list | join('; ') }}
  when: not ansible_check_mode
