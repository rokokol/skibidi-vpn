---
# A node must resolve its own name. sudo looks it up on every call and warns
# when it cannot, and so does anything that logs the host it runs on. A cloud
# image can ship /etc/hosts with the image's name on 127.0.1.1 while the node
# is called something else.
#
# Only an unresolvable name is fixed. Where cloud-init keeps /etc/hosts
# (manage_etc_hosts), the name already resolves and the file is left alone:
# cloud-init writes it again from its template on every boot, so an edit there
# would be lost and would also replace the domain cloud-init writes beside it
- name: Ask whether the node resolves its own name
  ansible.builtin.command:
    argv: [getent, hosts, "{{ ansible_facts['hostname'] }}"]
  register: common_own_name
  changed_when: false
  failed_when: false
  check_mode: false

- name: Map the node's name to 127.0.1.1
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ ansible_facts['hostname'] }}"
    owner: root
    group: root
    mode: "0644"
  when: common_own_name.rc != 0

- name: Ask again whether the node resolves its own name
  ansible.builtin.command:
    argv: [getent, hosts, "{{ ansible_facts['hostname'] }}"]
  changed_when: false
  check_mode: false
