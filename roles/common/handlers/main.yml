---
- name: Load kernel modules
  ansible.builtin.systemd_service:
    name: systemd-modules-load.service
    state: restarted

# --system rather than -p: the point is to read every drop-in in order, so a
# stale file that outranks ours shows up here rather than after the next reboot
- name: Apply sysctl settings
  ansible.builtin.command:
    argv: [sysctl, --system]
  changed_when: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
