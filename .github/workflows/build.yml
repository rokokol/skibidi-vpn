---
name: build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  # Automation verifies branches by calling this workflow against a ref — the
  # real checks, never a copy of their commands that drifts apart
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  flake:
    name: nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-flake-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-flake-${{ runner.os }}-
      # Copies only tracked files, which is what once caught a .gitignore
      # pattern that had swallowed the secret gate itself
      - run: nix flake check

  lint:
    name: Lint, secret gate, syntax
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SKIBIDI_NODES_DIR: ${{ github.workspace }}/inventory.example/nodes
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # An unpinned lookup makes a job change behavior with zero change in the
      # repo; every tool here comes from the flake's own lock
      - name: CI tools come from the lock, not the registry
        run: |
          if grep -rEn 'nix (run|shell) nixpkgs#|pip +install |npx +[a-z@.-]' .github/workflows; then
            echo "unpinned registry lookup in a workflow — pin the tool via the flake" >&2
            exit 1
          fi

      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-ci-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-ci-${{ runner.os }}-

      # A checkout does not preserve mode 600, and the inventory refuses
      # node files that anyone but their owner can read
      - name: Restore the registry permissions the inventory insists on
        run: chmod 600 inventory.example/nodes/*.toml

      - name: Secret gate
        run: ./tests/no-secrets.sh

      # The gate is proven able to fail: secrets are planted in a throwaway
      # clone the way they would really arrive, and each must turn it red
      - name: Secret gate falsification
        run: ./tests/falsify-secrets.sh

      - name: Report tests
        run: nix develop .#ci -c python3 -m unittest discover -s tests -v

      # Proves the suite would fail if the generator broke — a green suite
      # that cannot go red is not evidence
      - name: Falsification harness
        run: nix develop .#ci -c python3 tests/falsify.py

      - name: yamllint
        run: nix develop .#ci -c yamllint --strict .

      - name: ansible-lint
        run: nix develop .#ci -c ansible-lint

      # --syntax-check alone would shrug off a broken inventory as a warning;
      # requiring the example node in the output makes an empty registry loud
      - name: Inventory answers with the example node
        run: nix develop .#ci -c sh -c 'ansible-inventory --list | grep -q example'

      - name: Playbook syntax
        run: nix develop .#ci -c ansible-playbook site.yml --syntax-check
